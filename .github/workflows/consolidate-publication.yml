name: Consolidate and replay the complete research tree
on:
  push:
    branches: [research/consolidated-20260921]
    paths: [.github/workflows/consolidate-publication.yml]
permissions:
  contents: write
jobs:
  consolidate:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - name: Fetch exact public commits without persisted credentials
        env:
          SOURCE_SHA: ${{ github.sha }}
        run: |
          git init .
          git remote add origin https://github.com/rsgcsg/math-research.git
          git fetch --depth=1 origin "$SOURCE_SHA" a658761d00ce0395242faace7e8e0db9a1bb16ee
          git checkout --detach "$SOURCE_SHA"
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          python3 --version
      - name: Restore and hash-check all 483 source and evidence files
        run: |
          cp .research-publication/restore.py "$RUNNER_TEMP/restore.py"
          python3 "$RUNNER_TEMP/restore.py" restore
          # Keep the workflow unchanged for the contents-only CI token; the authorized connector removes it after replay.
          git restore --source=HEAD -- .github/workflows/consolidate-publication.yml
          git add -A
          git commit -m 'research: consolidate T001-T134 and E001-E104, clarify endgame obligations'
          git rev-parse HEAD > "$RUNNER_TEMP/checked-commit.txt"
      - name: One complete replay including the cross-version gzip fix
        env:
          PYTHONUNBUFFERED: '1'
        run: |
          set -o pipefail
          make check 2>&1 | tee "$RUNNER_TEMP/research-check.log"
      - name: Bind the successful replay and static audit to frozen sources
        run: |
          python3 "$RUNNER_TEMP/restore.py" seal
          git add certificates/consolidated_full_regression.json certificates/consolidated_static_audit.json certificates/dyadic_cyclic_orbit_validation.json certificates/finite_frame_validation.json
          git commit -m 'verification: bind single full PASS and static audit to consolidated source'
          git diff --exit-code
          git diff --cached --exit-code
          git archive --format=zip HEAD -o "$RUNNER_TEMP/research-consolidated.zip"
          git rev-parse HEAD > "$RUNNER_TEMP/published-commit.txt"
      - name: Fast-forward only the dedicated consolidation branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          AUTH="$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)"
          echo "::add-mask::$AUTH"
          git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic $AUTH" push origin "HEAD:refs/heads/research/consolidated-20260921"
      - name: Save the exact source and replay evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: consolidated-source-and-replay
          path: |
            ${{ runner.temp }}/research-consolidated.zip
            ${{ runner.temp }}/research-check.log
            ${{ runner.temp }}/checked-commit.txt
            ${{ runner.temp }}/published-commit.txt
            ${{ runner.temp }}/frozen-source.json
            ${{ runner.temp }}/transport-manifest.json
          retention-days: 7
          if-no-files-found: error
