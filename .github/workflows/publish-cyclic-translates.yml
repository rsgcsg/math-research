name: Verify and publish cyclic translate research once
on:
  push:
    branches: [main]
    paths: [.github/workflows/publish-cyclic-translates.yml]
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Fetch exact public history without saved credentials
        env:
          SOURCE_SHA: ${{ github.sha }}
        run: |
          git init .
          git remote add origin https://github.com/rsgcsg/math-research.git
          git fetch --no-tags origin "$SOURCE_SHA"
          git checkout --detach FETCH_HEAD
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13.5'
      - name: Restore exact reviewed source and replay independent certificates
        env:
          PYTHONUNBUFFERED: '1'
        run: |
          python3 - <<'PY'
          import base64, hashlib, json, lzma, os, platform, re, shutil, subprocess, time
          from datetime import datetime, timezone
          from pathlib import Path
          root=Path.cwd(); temp=Path(os.environ['RUNNER_TEMP'])
          expected_tree='ad5fd3f24eb084c440f836c690586b81e88169b6'
          expected_sources='a99b88c8ce687423b344a39f8f7c903866f7553181f80d15058be4916b980bc7'
          def sha(b): return hashlib.sha256(b).hexdigest()
          def git(*args,env=None): return subprocess.check_output(['git',*args],env=env,text=True).strip()
          parts=sorted((root/'.research-next').glob('part*.b64'))
          assert [p.name for p in parts]==['part0.b64','part1.b64','part2.b64']
          packed=base64.b64decode(''.join(''.join(p.read_text().split()) for p in parts),validate=True)
          assert sha(packed)=='ce2f175e3ec2954a0a2047bd41454020dda4beed42f618ad4b2f0dd294cf7f00'
          patch=lzma.decompress(packed)
          assert sha(patch)=='d3a9e567fa6e8e6431358ea8aa634ce874876a181c3d88dba3682e56111fd2d0'
          patch_path=temp/'cyclic-translates.patch'; patch_path.write_bytes(patch)
          subprocess.run(['git','apply','--check','--index',str(patch_path)],check=True)
          subprocess.run(['git','apply','--index',str(patch_path)],check=True)
          subprocess.run(['git','rm','-r','.research-next'],check=True)
          alternate=temp/'target.index'; shutil.copyfile(root/'.git/index',alternate)
          env=dict(os.environ,GIT_INDEX_FILE=str(alternate))
          subprocess.run(['git','update-index','--force-remove','.github/workflows/publish-cyclic-translates.yml'],env=env,check=True)
          assert git('write-tree',env=env)==expected_tree,'reviewed target tree differs'
          def sources():
              paths=['Makefile','requirements-research.txt']+sorted(str(p.relative_to(root)) for p in (root/'research').glob('*.py'))
              return {p:sha((root/p).read_bytes()) for p in paths}
          frozen=sources(); fingerprint=sha(json.dumps(frozen,sort_keys=True,separators=(',',':')).encode())
          assert fingerprint==expected_sources
          proof=(root/'docs/proofs/cyclic_translate_effective.md').read_text()
          blocks=re.findall(r'```python\n(.*?)\n```',proof,re.S)
          assert len(blocks)==1
          calibration=temp/'moser-kernel-replay.py'; calibration.write_text(blocks[0]+'\n')
          assert sha(calibration.read_bytes())=='30d6d97e5c4abb6a77eeb2348ac0fd8b0c6e722d06af402cf4dcd5664d9ad0c0'
          commands=[['make','check-cyclic-translates'],['python3','-S',str(calibration)]]
          reports=[]; started=datetime.now(timezone.utc).isoformat()
          for index,command in enumerate(commands):
              log=temp/f'cyclic-replay-{index}.log'; tick=time.monotonic()
              with log.open('w') as output:
                  result=subprocess.run(command,stdout=output,stderr=subprocess.STDOUT)
              reports.append(dict(command=command,returncode=result.returncode,elapsed_seconds=round(time.monotonic()-tick,3),log_sha256=sha(log.read_bytes())))
              if result.returncode:
                  print(log.read_text()[-12000:]); raise RuntimeError('independent replay failed')
          assert sources()==frozen,'research source changed during replay'
          subprocess.run(['git','diff','--exit-code'],check=True)
          subprocess.run(['git','diff','--cached','--check'],check=True)
          report=dict(schema='hn-cyclic-translate-remote-replay-v1',status='PASS',date='2026-09-28',started_utc=started,completed_utc=datetime.now(timezone.utc).isoformat(),python=platform.python_version(),run_id=os.environ['GITHUB_RUN_ID'],transport_commit=os.environ['GITHUB_SHA'],reviewed_research_tree=expected_tree,source_manifest_sha256=fingerprint,source_file_count=len(frozen),research_sources_unchanged=True,commands=reports,scope='Actual remote targeted independent replay and separately executed Moser-kernel documentation calibration. Not a full make check; the local full regression is recorded separately. T140 concerns a finite-valued single-generator subclass; E112 does not give an HN bound or a full fifteen-domain law.')
          receipt=root/'certificates/cyclic_translate_remote_replay.json'
          receipt.write_text(json.dumps(report,ensure_ascii=False,indent=2)+'\n')
          (temp/'cyclic-remote-receipt.json').write_bytes(receipt.read_bytes())
          (temp/'cyclic-source-manifest.json').write_text(json.dumps(frozen,sort_keys=True,indent=2)+'\n')
          subprocess.run(['git','add',str(receipt.relative_to(root))],check=True)
          subprocess.run(['git','commit','-m','research: T140 effective cyclic contacts and finite kernels; independently replay E112'],check=True)
          (temp/'cyclic-published-commit.txt').write_text(git('rev-parse','HEAD')+'\n')
          print(json.dumps(dict(status='TARGETED_PASS',source_manifest=fingerprint,commit=git('rev-parse','HEAD')),ensure_ascii=False),flush=True)
          PY
      - name: Publish by fast-forward only
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_SHA: ${{ github.sha }}
        run: |
          test "$(git ls-remote origin refs/heads/main | cut -f1)" = "$SOURCE_SHA"
          AUTH="$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)"
          echo "::add-mask::$AUTH"
          git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic $AUTH" push origin HEAD:refs/heads/main
          git bundle create "$RUNNER_TEMP/cyclic-published-history.bundle" HEAD
      - name: Retain actual history and replay evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: cyclic-translates-research-and-replay
          path: |
            ${{ runner.temp }}/cyclic-published-history.bundle
            ${{ runner.temp }}/cyclic-published-commit.txt
            ${{ runner.temp }}/cyclic-remote-receipt.json
            ${{ runner.temp }}/cyclic-source-manifest.json
            ${{ runner.temp }}/cyclic-replay-*.log
          retention-days: 30
          if-no-files-found: error
