name: Exact full-law pricing research and independent replay
on:
  push:
    branches: [research/full-law-loop-20260922]
    paths: [.github/workflows/full-law-loop.yml]
permissions:
  contents: write
jobs:
  research:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Fetch the exact public source without saved credentials
        env:
          SOURCE_SHA: ${{ github.sha }}
        run: |
          git init .
          git remote add origin https://github.com/rsgcsg/math-research.git
          git fetch --depth=1 origin "$SOURCE_SHA"
          git checkout --detach FETCH_HEAD
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13.5'
      - name: Restore the lossless source delta and verify every file
        run: |
          python - <<'PY'
          import base64,hashlib,json,lzma,shutil
          from pathlib import Path
          sha=lambda b:hashlib.sha256(b).hexdigest()
          raw=base64.b64decode(''.join(p.read_text() for p in sorted(Path('.research-e105').glob('part*.b64'))))
          assert sha(raw)=='10a014e0aecf91fbc9fa4c5eef1fc0f48017eb043d344ec5500a3278cee87430'
          d=json.loads(lzma.decompress(raw))
          assert d['schema']=='e105-delta-v2' and d['base']=='53feae233ab7d781b3ca32242fabfabfb9cde3d4'
          for e in d['changes']:
              p=Path(e['path']);assert not p.is_absolute() and '..' not in p.parts and '.git' not in p.parts
              old=p.read_text() if p.exists() else ''
              assert sha(old.encode())==e['old_sha256'],str(p)
              new=old[:e['prefix']]+e['middle']+(old[-e['suffix']:] if e['suffix'] else '')
              assert sha(new.encode())==e['new_sha256'],str(p)
              p.parent.mkdir(parents=True,exist_ok=True);p.write_text(new)
          shutil.rmtree('.research-e105')
          print('RESTORED',len(d['changes']))
          PY
      - name: Install explicit search-only versions
        run: python -m pip install numpy==2.3.5 scipy==1.17.0 python-sat==1.9.dev15 sympy==1.14.0
      - name: Rebuild audited input without using the preparation producer
        run: |
          python research/audit_full_law_preparation.py --write-cache "$RUNNER_TEMP/geometry.json.gz" > "$RUNNER_TEMP/input-replay.json"
      - name: Execute all three bounded pricing strategies and small calibrations
        env:
          PYTHONUNBUFFERED: '1'
        run: |
          set -o pipefail
          python research/build_full_law_pricing.py --results-dir "$RUNNER_TEMP/e105-runs" --cache "$RUNNER_TEMP/geometry.json.gz" 2>&1 | tee "$RUNNER_TEMP/pricing-search.log"
      - name: Independent standard-library evidence replay and mutation tests
        run: |
          python research/test_full_law_pricing.py > certificates/full_law_pricing_validation.json
          python - <<'PY'
          import hashlib,json,os,platform
          from pathlib import Path
          r=json.loads(Path('certificates/full_law_pricing_validation.json').read_text())
          assert r['status']=='PASS'
          assert [(x['proper_words'],x['final_rows']) for x in r['runs']]==[(11,256),(21,540),(13,135)],'different run; update analysis before publishing'
          assert not r['full_fifteen_domain_law_found'] and not r['all_word_obstruction_certified']
          paths=[Path('Makefile'),Path('requirements-research.txt'),*sorted(Path('research').glob('*.py'))]
          h=lambda b:hashlib.sha256(b).hexdigest()
          manifest={str(p):h(p.read_bytes()) for p in paths}
          ms=h(json.dumps(manifest,sort_keys=True,separators=(',',':')).encode())
          assert ms=='132c7c30a8b067fabf054510598d3b2e39f8f737b9736d43d5439ac6383c03a5'
          receipt=dict(status='PASS',schema='full-law-pricing-ci-v1',source_manifest_sha256=ms,source_files=manifest,python=platform.python_version(),run_id=os.environ['GITHUB_RUN_ID'],base_commit='53feae233ab7d781b3ca32242fabfabfb9cde3d4',certificate_sha256=h(Path('certificates/full_law_pricing.json.gz').read_bytes()),search_log_sha256=h((Path(os.environ['RUNNER_TEMP'])/'pricing-search.log').read_bytes()),scope='New E105/C024 search reconstruction and independent tests only. Not the full repository regression or a new HN bound.')
          Path('certificates/full_law_pricing_ci.json').write_text(json.dumps(receipt,indent=2)+'\n')
          PY
      - name: Publish only the dedicated research branch with fast-forward
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git add -A
          git diff --cached --check
          git commit -m 'E105/C024: execute full-law pricing, certify finite-pool cuts and minimal mixed-motion counterexample'
          AUTH="$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)"
          echo "::add-mask::$AUTH"
          git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic $AUTH" push origin HEAD:refs/heads/research/full-law-loop-20260922
          git archive --format=zip HEAD -o "$RUNNER_TEMP/full-law-loop-source.zip"
          git rev-parse HEAD > "$RUNNER_TEMP/published-commit.txt"
      - name: Export the actual run and evidence, including on failure
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: full-law-loop-source-and-evidence
          path: |
            ${{ runner.temp }}/full-law-loop-source.zip
            ${{ runner.temp }}/published-commit.txt
            ${{ runner.temp }}/input-replay.json
            ${{ runner.temp }}/pricing-search.log
            ${{ runner.temp }}/e105-runs/*
            certificates/full_law_pricing*.json*
          retention-days: 7
          if-no-files-found: error
