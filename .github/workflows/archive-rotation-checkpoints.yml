name: Archive merged rotation checkpoints once
on:
  push:
    branches: [main]
    paths: [.github/workflows/archive-rotation-checkpoints.yml]
permissions:
  contents: write
  pull-requests: read
  actions: read
jobs:
  archive:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Load exact published history without saved credentials
        env:
          SOURCE_SHA: ${{ github.sha }}
        run: |
          git init .
          git remote add origin https://github.com/rsgcsg/math-research.git
          git fetch --no-tags origin "$SOURCE_SHA"
          git checkout --detach FETCH_HEAD
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13.5'
      - name: Replay, archive exact merged heads, and publish receipts
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python - <<'PY'
          """One-use archival for two fully merged, exact research branch heads."""
          import base64, hashlib, json, os, platform, subprocess
          from datetime import datetime, timezone
          from pathlib import Path
          from urllib.request import Request, urlopen
          REPO='rsgcsg/math-research'
          BASE='4a11fe3f4a957b166fd8f340d950a2a9563a5cec'
          TIP='875c4f802125f804039ae43586d3c2a8caa19b3d'
          TARGETS={
           'research/rotation-integration-20260926':'3af5a63622185c1393f8e30efda41609ea223230',
           'research/rotation-rank2-20260926':'482b53020f36900ab2fcceff801ee2eb84893d94',
          }
          PREFIX='refs/tags/archive/2026-09-27/'
          TEMP=Path(os.environ.get('RUNNER_TEMP','/tmp'))
          def git(*a): return subprocess.check_output(['git',*a],text=True).strip()
          def refs(): return {ref:sha for sha,ref in (line.split() for line in git('ls-remote','--refs','origin').splitlines())}
          def digest(raw): return hashlib.sha256(raw).hexdigest()
          def source_manifest():
           paths=[Path('Makefile'),Path('requirements-research.txt'),*sorted(Path('research').glob('*.py'))]
           return {str(p):digest(p.read_bytes()) for p in paths}
          def pages(path,key=None):
           items=[]
           for page in range(1,101):
            u=f'https://api.github.com/repos/{REPO}/{path}'+('&' if '?' in path else '?')+f'per_page=100&page={page}'
            r=Request(u,headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'],'Accept':'application/vnd.github+json'})
            with urlopen(r,timeout=40) as f: data=json.load(f)
            batch=data[key] if key else data;items.extend(batch)
            if len(batch)<100:return items
           raise RuntimeError('Pagination incomplete')
          def plan(snapshot,main_sha,open_branches,active_branches,ancestor):
           if snapshot.get('refs/heads/main')!=main_sha:raise RuntimeError('main changed')
           out=[]
           for branch,sha in TARGETS.items():
            head='refs/heads/'+branch;tag=PREFIX+branch
            if branch in open_branches or branch in active_branches:raise RuntimeError('Open PR or active workflow: '+branch)
            if snapshot.get(tag) not in (None,sha):raise RuntimeError('Conflicting archive: '+branch)
            if snapshot.get(head) not in (None,sha):raise RuntimeError('Branch advanced: '+branch)
            if head not in snapshot and snapshot.get(tag)!=sha:raise RuntimeError('Missing unarchived branch: '+branch)
            if not ancestor(sha,main_sha):raise RuntimeError('Unmerged work: '+branch)
            out.append((head,tag,sha,tag not in snapshot,head in snapshot))
           return out
          
          def main():
           if os.environ.get('GITHUB_REPOSITORY')!=REPO or os.environ.get('GITHUB_REF')!='refs/heads/main':raise RuntimeError('Wrong target')
           source=os.environ['GITHUB_SHA']
           if git('rev-parse','HEAD')!=source or git('rev-parse','HEAD^')!=BASE:raise RuntimeError('Unexpected source parent')
           for sha in [BASE,TIP,*TARGETS.values()]:subprocess.run(['git','merge-base','--is-ancestor',sha,source],check=True)
           # The already published mathematical source and certificates must match the original local checkpoint.
           if git('diff','--name-only',TIP,source,'--','research','certificates','Makefile','requirements-research.txt'):raise RuntimeError('Research changed')
           m=source_manifest();mh=digest(json.dumps(m,sort_keys=True,separators=(',',':')).encode())
           if mh!='a7cf5abec5fffbe332a588f88f3d028da8c5264e389962b9e1d5b29e087a3eaa':raise RuntimeError('Source binding')
           started=datetime.now(timezone.utc).isoformat()
           with (TEMP/'check-next.log').open('w') as f:subprocess.run(['make','check-next'],stdout=f,stderr=subprocess.STDOUT,check=True)
           completed=datetime.now(timezone.utc).isoformat()
           if source_manifest()!=m:raise RuntimeError('Source changed during replay')
           opened=pages('pulls?state=open');runs=pages('actions/runs','workflow_runs')
           open_branches={p[s]['ref'] for p in opened for s in ('head','base') if p[s]['repo'] and p[s]['repo']['full_name']==REPO}
           active={r['head_branch'] for r in runs if r['status']!='completed' and str(r['id'])!=os.environ['GITHUB_RUN_ID']}
           def ancestor(a,b):
            r=subprocess.run(['git','merge-base','--is-ancestor',a,b])
            if r.returncode not in (0,1):raise RuntimeError('Ancestry check failed')
            return r.returncode==0
           before=refs();p=plan(before,source,open_branches,active,ancestor)
           if plan(refs(),source,open_branches,active,ancestor)!=p:raise RuntimeError('Refs changed before push')
           flags=[];spec=[]
           for head,tag,sha,new_tag,delete in p:
            if new_tag:flags.append('--force-with-lease='+tag+':');spec.append(sha+':'+tag)
            if delete:flags.append('--force-with-lease='+head+':'+sha);spec.append(':'+head)
           auth=base64.b64encode(('x-access-token:'+os.environ['GH_TOKEN']).encode()).decode()
           print('::add-mask::'+auth,flush=True)
           env=os.environ.copy();env.update(GIT_CONFIG_COUNT='1',GIT_CONFIG_KEY_0='http.https://github.com/.extraheader',GIT_CONFIG_VALUE_0='AUTHORIZATION: basic '+auth)
           if spec:subprocess.run(['git','push','--atomic',*flags,'origin',*spec],env=env,check=True)
           after=refs()
           for head,tag,sha,_,_ in p:
            if head in after or after.get(tag)!=sha:raise RuntimeError('Remote readback failed')
           for ref,sha in before.items():
            if ref not in {x[0] for x in p} and after.get(ref)!=sha:raise RuntimeError('Unrelated ref changed: '+ref)
           report={'schema':'hn-branch-archive-v1','date':'2026-09-27','status':'PASS','checked_main':source,'prior_main':BASE,'cleanup_run':os.environ['GITHUB_RUN_ID'],'timestamp_utc':datetime.now(timezone.utc).isoformat(),'branches':[{'branch':head[11:],'expected_sha':sha,'archive_tag':tag[10:],'ancestor_of_main':True,'result':'ARCHIVED_AND_DELETED'} for head,tag,sha,_,_ in p],'branches_after':{k[11:]:v for k,v in after.items() if k.startswith('refs/heads/')},'guards':['explicit-two-branch-whitelist','exact-branch-heads','merged-ancestry','no-open-PR','no-active-branch-run','no-conflicting-archive','atomic-tag-and-delete','per-ref-expected-SHA-lease','remote-readback','unrelated-refs-unchanged'],'scope':'Branch pointers only; full history retained by exact tags. Old archive tags are unchanged.'}
           receipt={'schema':'hn-publication-cleanup-replay-v1','date':'2026-09-27','status':'PASS_TARGETED_UNCHANGED_SOURCE','checked_commit':source,'original_checkpoint':TIP,'source_file_count':len(m),'source_manifest_sha256':mh,'source_unchanged':True,'command':'make check-next','returncode':0,'python':platform.python_version(),'started_utc':started,'completed_utc':completed,'log_sha256':digest((TEMP/'check-next.log').read_bytes()),'run_id':os.environ['GITHUB_RUN_ID'],'scope':'Fresh independent check-next plus byte identity of all inherited research and certificates to checkpoint 875c4f8. Not a fresh full make check, formalization, or new HN bound. Existing full-baseline and staged evidence remain in baseline_next_validation.json.'}
           for path,data in [('docs/branch_archive_20260927.json',report),('certificates/publication_cleanup_20260927.json',receipt)]:Path(path).write_text(json.dumps(data,ensure_ascii=False,indent=2)+'\n')
           subprocess.run(['git','add','docs/branch_archive_20260927.json','certificates/publication_cleanup_20260927.json'],check=True)
           subprocess.run(['git','diff','--cached','--check'],check=True)
           subprocess.run(['git','commit','-m','maintenance: record verified rotation archival and fresh targeted replay'],check=True)
           subprocess.run(['git','push','origin','HEAD:refs/heads/main'],env=env,check=True)
           final=git('rev-parse','HEAD')
           if refs().get('refs/heads/main')!=final:raise RuntimeError('Receipt publication not confirmed')
           subprocess.run(['git','bundle','create',str(TEMP/'published-history.bundle'),'HEAD'],check=True)
           (TEMP/'published-commit.txt').write_text(final+'\n')
           print(json.dumps({'status':'PASS','archived':len(p),'main':final,'remaining_branches':sorted(report['branches_after'])}),flush=True)
          if __name__=='__main__':main()
          PY
      - name: Retain full history and actual verification output
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: rotation-cleanup-history-and-evidence
          path: |
            ${{ runner.temp }}/published-history.bundle
            ${{ runner.temp }}/published-commit.txt
            ${{ runner.temp }}/check-next.log
            docs/branch_archive_20260927.json
            certificates/publication_cleanup_20260927.json
          retention-days: 30
          if-no-files-found: error
