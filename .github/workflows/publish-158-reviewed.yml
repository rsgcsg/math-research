name: Publish reviewed Family158 extension
on:
  push:
    branches: [research/openai-158-audit-20261007]
    paths: [.github/workflows/publish-158-reviewed.yml]
permissions:
  contents: write
  actions: read
jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Fetch exact project branch without stored credentials
        env:
          SOURCE_SHA: ${{ github.sha }}
        run: |
          set -eu
          git init .
          git remote add origin https://github.com/rsgcsg/math-research.git
          git fetch --no-tags origin "$SOURCE_SHA"
          git checkout --detach FETCH_HEAD
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
      - name: Download previously recovered draft and actual upstream evidence
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh run download 37576390587 --repo rsgcsg/math-research --name family158-recovered-draft --dir "$RUNNER_TEMP/recovered"
          gh run download 37572850907 --repo rsgcsg/math-research --name family158-pinned-source --dir "$RUNNER_TEMP/source"
          gh run download 37573206401 --repo rsgcsg/math-research --name family158-lean-attempt --dir "$RUNNER_TEMP/lean"
      - name: Apply exact reviewed changes and bind actual checks
        env:
          GH_TOKEN: ${{ github.token }}
          PYTHONUNBUFFERED: '1'
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import base64,hashlib,json,os,shutil,subprocess,zipfile
          root=Path.cwd();tmp=Path(os.environ['RUNNER_TEMP']);patch=tmp/'recovered/draft.decoded'
          def sha(b):return hashlib.sha256(b).hexdigest()
          def require(ok,msg):
              if not ok:raise RuntimeError(msg)
          def git(*args):return subprocess.check_output(['git',*args],text=True).strip()
          expected={
          'Makefile':'cd4df09189ad9200e3f8bf7828349b1cb2845117e11f14f684431a18f9b1bf61',
          'README.md':'64dfb01ee8db74ac9a7ff09c837359d80dcb6d60cdef5f67ca10d14a16758c21',
          'certificates/radical_transfer_calibration.json':'45f985953922f791c3ff7afa1b859bd5cbb3c52428f84e7d9276b207d5ad0e4d',
          'docs/CURRENT.md':'ecb4bb8d2ae439dfe2d3291af7f25dd8bccedf4c160654d8889a6f65878e6854',
          'docs/RESULTS.md':'cfcd4bfb31a7f64c8b87ba2af6008281c040083715177f1e0d0cd0ae98cb928f',
          'docs/ROUTES.md':'aa8932fb6a61b12158130104d79d00cb02e6f0396863e4f1ff66ba54a4596425',
          'docs/proofs/algebraic_subfield_haar_transfer.md':'0beeec63333684aabf26605bd47547a5c6f2402c93bb03dc8b89cd6e3f5198dc',
          'docs/proofs/hn_unified_framework.md':'c0503ad12ce37f50ec6b471afaa1326bb064444f30cacc8f474c31999af6c4d3',
          'docs/proofs/radical_plane_colorability.md':'746c71339e629bc495e0d813b0c0472918080425a471c91bf06e24117f7a8e66',
          'references/LITERATURE_MAP.md':'17cd7916b3d08e68a1b073070e40b4b3e3091a8581fa727d6716b503c07a3e45',
          'references/OPENAI_158_AUDIT.md':'7aa382db0a0ff57e350fe6c553c0c52b1eeab59dd04516991315cacf3b20afda',
          'references/SOURCES.md':'6f86011af3953f92a0ff16284c40b01c3c12394f954cc613efa0b18111dc10cb',
          'research/audit_openai_158_sources.py':'90bf6768989accf272c5963c52a7002f4250834ab86f304051a0e68d377eceaa',
          'research/verify_radical_transfer_calibration.py':'05f354a7495447d838e15ac790368a4842a4abb32ae3c9e888ff8b2bd7875e8e'}
          require(sha(patch.read_bytes())=='20e1d974745aa239c85762741808c366cfd5f2a7c842b24265c2d11d821507dc','patch hash')
          paths=[line[6:] for line in patch.read_text().splitlines() if line.startswith('+++ b/')]
          require(set(paths)==set(expected) and len(paths)==len(expected),'patch path set')
          subprocess.run(['git','apply','--check',str(patch)],check=True)
          subprocess.run(['git','apply',str(patch)],check=True)
          require(all(sha((root/p).read_bytes())==s for p,s in expected.items()),'reviewed bytes mismatch')
          shutil.copyfile(tmp/'source/upstream-source-receipt.json','certificates/openai_158_source_audit.json')
          shutil.copyfile(tmp/'lean/lean-check-receipt.json','certificates/openai_158_lean_replay.json')
          lr=json.loads((tmp/'lean/lean-check-receipt.json').read_text())
          require(lr['status']=='PASS' and set(lr['axioms'])=={'propext','Classical.choice','Quot.sound'},'Lean evidence state')
          require(lr['upstream']=='adc7f1241b42e322a6451854ab7e4b4c146bf78a','upstream pin')
          with zipfile.ZipFile('certificates/openai_158_lean_logs.zip','w',zipfile.ZIP_DEFLATED) as z:
              for p in sorted((tmp/'lean').rglob('*')):
                  if p.is_file():z.write(p,str(p.relative_to(tmp/'lean')))
          commands=[['python3','-S','research/verify_radical_transfer_calibration.py','--self-test'],['python3','-S','research/audit_openai_158_sources.py',str(tmp/'source/family158-source.zip')],['python3','-S','research/check_integration.py']]
          out=root/'certificates/openai_158_replay';out.mkdir()
          records=[]
          for i,c in enumerate(commands):
              r=subprocess.run(c,stdout=subprocess.PIPE,stderr=subprocess.STDOUT,timeout=120)
              (out/f'{i}.log').write_bytes(r.stdout);require(r.returncode==0,'targeted verification failed')
              records.append({'command':c,'returncode':r.returncode,'log_sha256':sha(r.stdout)})
          report={'schema':'hn-158-reviewed-publication-v1','status':'PASS_TARGETED_CHECKS','source_commit':os.environ['GITHUB_SHA'],'run_id':os.environ['GITHUB_RUN_ID'],'patch_sha256':sha(patch.read_bytes()),'reviewed_files':expected,'commands':records,'scope':'Recovered draft fully inspected before this workflow. Exact finite algebra and source binding/static checks freshly replayed. Original no-five Lean build was run 37573206401; extension is written proof, not Lean-formalized. No full make check rerun; no explicit NON5 graph or six-coloring of the plane.'}
          (root/'certificates/openai_158_publication_validation.json').write_text(json.dumps(report,indent=2)+'\n')
          subprocess.run(['git','diff','--check'],check=True)
          allowed=set(expected)|{'certificates/openai_158_source_audit.json','certificates/openai_158_lean_replay.json','certificates/openai_158_lean_logs.zip','certificates/openai_158_publication_validation.json'}|{str(p.relative_to(root)) for p in out.glob('*.log')}
          changed=set(git('diff','--name-only').splitlines())|set(git('ls-files','--others','--exclude-standard').splitlines())
          require(changed==allowed,'unexpected publication changes')
          subprocess.run(['git','add','-f','--',*sorted(allowed)],check=True)
          subprocess.run(['git','commit','-m','research: audit external no-five theorem and prove radical-subfield distance-colorability transfer'],check=True)
          branch='research/openai-158-audit-20261007'
          require(git('ls-remote','origin','refs/heads/'+branch).split()[0]==os.environ['GITHUB_SHA'],'branch moved')
          auth=base64.b64encode(('x-access-token:'+os.environ['GH_TOKEN']).encode()).decode()
          env=os.environ.copy();env.update(GIT_CONFIG_COUNT='1',GIT_CONFIG_KEY_0='http.https://github.com/.extraheader',GIT_CONFIG_VALUE_0='AUTHORIZATION: basic '+auth)
          subprocess.run(['git','push','--porcelain','origin','HEAD:refs/heads/'+branch],check=True,env=env)
          final=tmp/'published';final.mkdir();subprocess.run(['git','branch','audit-export','HEAD'],check=True)
          subprocess.run(['git','bundle','create',str(final/'source.bundle'),'audit-export'],check=True)
          subprocess.run(['git','archive','--format=zip','HEAD','-o',str(final/'source.zip')],check=True)
          (final/'publication.json').write_text(json.dumps({'commit':git('rev-parse','HEAD'),'tree':git('rev-parse','HEAD^{tree}'),'status':'PUBLISHED_TO_RESEARCH_BRANCH'},indent=2)+'\n')
          print('PUBLISHED',git('rev-parse','HEAD'))
          PY
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: family158-published-proof
          path: ${{ runner.temp }}/published
          retention-days: 30
          if-no-files-found: error
