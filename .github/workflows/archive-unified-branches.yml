name: Archive integrated research branches
on:
  push:
    branches: [main]
    paths: [.github/workflows/archive-unified-branches.yml]
permissions:
  contents: write
  pull-requests: read
  actions: read
jobs:
  archive:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Fetch the exact merged source without stored credentials
        env:
          SOURCE_SHA: ${{ github.sha }}
        run: |
          set -eu
          git init .
          git remote add origin https://github.com/rsgcsg/math-research.git
          git fetch --no-tags origin "$SOURCE_SHA"
          git checkout --detach "$SOURCE_SHA"
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13.5'
      - name: Archive only verified heads and record actual remote outcome
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_INTEGRATION_HEAD: 3c7ca34060cb8f22997895507934d990a7e42ede
          PYTHONUNBUFFERED: '1'
        run: |
          set -o pipefail
          python3 - <<'PY'
          import os
          from pathlib import Path
          code=Path('.maintenance/archive_integrated.py').read_text()
          unsafe="print('::add-mask::'+auth,flush=True)"
          if code.count(unsafe)!=1:raise SystemExit('unexpected authorization logging source')
          code=code.replace(unsafe,'pass  # Authorization stays only in subprocess environment')
          (Path(os.environ['RUNNER_TEMP'])/'archive_no_credentials.py').write_text(code)
          PY
          python3 -S "$RUNNER_TEMP/archive_no_credentials.py" 2>&1 | tee "$RUNNER_TEMP/archive.log"
      - name: Preserve exact archive, source, history and outcome
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: unified-final-history-and-archive
          path: |
            ${{ runner.temp }}/final
            ${{ runner.temp }}/archive.log
          retention-days: 30
          if-no-files-found: error
