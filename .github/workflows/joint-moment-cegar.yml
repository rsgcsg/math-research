name: Quadratic-moment full-joint search
on:
  push:
    branches: [research/joint-pair-cegar-20260920]
    paths: [research/joint_moment_cegar.py, .github/workflows/joint-moment-cegar.yml]
permissions:
  contents: write
jobs:
  search:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Fetch the exact public commit without storing credentials
        env:
          SOURCE_SHA: ${{ github.sha }}
        run: |
          git init .
          git remote add origin https://github.com/rsgcsg/math-research.git
          git fetch --depth=1 origin "$SOURCE_SHA"
          git checkout --detach FETCH_HEAD
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          python3 -m pip install --disable-pip-version-check --only-binary=:all: python-sat==1.9.dev15
      - name: Run the single bounded T127 moment search
        run: |
          set -o pipefail
          python3 -u research/joint_moment_cegar.py --budget 300000 --rounds 250 --seconds 600 | tee /tmp/joint-moment-cegar.log
      - name: Independently validate complete positive laws, not just moments
        run: python3 -u research/verify_joint_moment_cegar.py
      - name: Archive the exact search result without replacing newer work
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_SHA: ${{ github.sha }}
        run: |
          python3 - <<'PY'
          import base64,hashlib,json,os,urllib.request
          from pathlib import Path
          base='https://api.github.com/repos/rsgcsg/math-research'
          headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'],'Accept':'application/vnd.github+json','X-GitHub-Api-Version':'2022-11-28'}
          def api(path,data=None,method=None):
              req=urllib.request.Request(base+path,data=None if data is None else json.dumps(data).encode(),headers=headers,method=method)
              with urllib.request.urlopen(req,timeout=30) as response:return json.load(response)
          branch='research/joint-pair-cegar-20260920';head=api('/git/ref/heads/'+branch)['object']['sha']
          if head!=os.environ['SOURCE_SHA']:raise SystemExit('Branch moved; refusing to overwrite newer work')
          path=Path('certificates/joint_moment_cegar.json');data=json.loads(path.read_text());data['source_commit']=head
          path.write_text(json.dumps(data,indent=2)+'\n')
          reportpath=Path('certificates/joint_moment_cegar_validation.json');report=json.loads(reportpath.read_text())
          report.update(source_commit=head,certificate_sha256=hashlib.sha256(path.read_bytes()).hexdigest())
          reportpath.write_text(json.dumps(report,indent=2)+'\n')
          tree=api('/git/commits/'+head)['tree']['sha'];entries=[]
          for p in (path,reportpath):
              blob=api('/git/blobs',{'content':base64.b64encode(p.read_bytes()).decode(),'encoding':'base64'},'POST')
              entries.append({'path':str(p),'mode':'100644','type':'blob','sha':blob['sha']})
          newtree=api('/git/trees',{'base_tree':tree,'tree':entries},'POST')['sha']
          count=0 if data['result'] is None else data['result']['full_domain_count']
          status=data['search']['status']
          commit=api('/git/commits',{'message':f'E099: archive moment CEGAR {status}, certified domains={count}','tree':newtree,'parents':[head]},'POST')['sha']
          api('/git/refs/heads/'+branch,{'sha':commit,'force':False},'PATCH')
          print('ARCHIVED_COMMIT '+commit)
          print('ARCHIVED_STATUS '+status+' POSITIVE_DOMAINS '+str(count))
          PY
