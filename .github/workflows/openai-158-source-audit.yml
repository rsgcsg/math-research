name: Pinned Family 158 source audit
on:
  push:
    branches: [research/openai-158-audit-20261007]
    paths: [.github/workflows/openai-158-source-audit.yml]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  source:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Fetch pinned public sources without executing upstream code
        env:
          UPSTREAM_SHA: adc7f1241b42e322a6451854ab7e4b4c146bf78a
        run: |
          set -euo pipefail
          mkdir upstream && cd upstream
          git init .
          git remote add origin https://github.com/openai/math.git
          git fetch --depth=1 --filter=blob:none origin "$UPSTREAM_SHA"
          test "$(git rev-parse FETCH_HEAD)" = "$UPSTREAM_SHA"
          git ls-tree -r --long FETCH_HEAD > "$RUNNER_TEMP/upstream-tree.txt"
          git checkout FETCH_HEAD -- README.md LICENSE CONTENTS.md overview.tex lean/README.md lean/formalization.yaml lean/lean-toolchain lean/lakefile.toml lean/ComparatorChallenges/README.md lean/ComparatorChallenges/EuclideanFiveColor.lean lean/ComparatorChallenges/PlaneColoring.lean lean/docs/158.md lean/OAI/Geometry/PlaneColoring preprints/The-Euclidean-plane-is-not-five-colorable-September-23-2026
          python3 - <<'PY'
          from pathlib import Path
          import hashlib,json,os,zipfile
          root=Path.cwd(); paths=sorted(p for p in root.rglob('*') if p.is_file() and '.git' not in p.parts)
          manifest={str(p.relative_to(root)):hashlib.sha256(p.read_bytes()).hexdigest() for p in paths}
          report=dict(schema='upstream-source-only-v1',upstream='openai/math',commit=os.environ['UPSTREAM_SHA'],files=manifest,scope='Source retrieval and byte binding only. No Lean build or mathematical verification is claimed.')
          (Path(os.environ['RUNNER_TEMP'])/'upstream-source-receipt.json').write_text(json.dumps(report,indent=2)+'\n')
          with zipfile.ZipFile(Path(os.environ['RUNNER_TEMP'])/'family158-source.zip','w',zipfile.ZIP_DEFLATED) as z:
              for p in paths:z.write(p,str(p.relative_to(root)))
          PY
      - name: Preserve source and manifest
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: family158-pinned-source
          path: |
            ${{ runner.temp }}/family158-source.zip
            ${{ runner.temp }}/upstream-source-receipt.json
            ${{ runner.temp }}/upstream-tree.txt
          retention-days: 30
          if-no-files-found: error
