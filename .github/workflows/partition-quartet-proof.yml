name: Exact quartet and five-point certificate replay
on:
  push:
    branches: [research/joint-pair-cegar-20260920]
    paths: [.github/quartet-checkpoint.patch, .github/workflows/partition-quartet-proof.yml]
permissions:
  contents: write
jobs:
  verify:
    if: ${{ !startsWith(github.event.head_commit.message, 'T127–128 / E098') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Fetch the exact public commit without persisted credentials
        env:
          SOURCE_SHA: ${{ github.sha }}
        run: |
          git init .
          git remote add origin https://github.com/rsgcsg/math-research.git
          git fetch --depth=1 origin "$SOURCE_SHA"
          git checkout --detach FETCH_HEAD
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
      - name: Apply the reviewed checkpoint and independently verify the generated certificate
        run: |
          git apply --check .github/quartet-checkpoint.patch
          git apply .github/quartet-checkpoint.patch
          rm .github/quartet-checkpoint.patch
          python3 research/build_partition_quartet_certificate.py
          echo '4021f7cd2ac3674caa0a5a631c7df00537c7a57b59f3d2dd21838bb5a5848332  certificates/partition_quartet_completeness.json.gz' | sha256sum -c -
          make check-quartet
          git diff --check
      - name: Atomically publish only the checked checkpoint files
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_SHA: ${{ github.sha }}
        run: |
          python3 - <<'PY'
          import base64,json,os,urllib.request
          from pathlib import Path
          base='https://api.github.com/repos/rsgcsg/math-research'
          headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'],'Accept':'application/vnd.github+json','X-GitHub-Api-Version':'2022-11-28'}
          def api(path,data=None,method=None):
              req=urllib.request.Request(base+path,data=None if data is None else json.dumps(data).encode(),headers=headers,method=method)
              with urllib.request.urlopen(req,timeout=30) as response:return json.load(response)
          branch='research/joint-pair-cegar-20260920';head=api('/git/ref/heads/'+branch)['object']['sha']
          if head!=os.environ['SOURCE_SHA']:raise SystemExit('Branch moved; refusing to overwrite newer work')
          paths=['Makefile','README.md','docs/CURRENT.md','docs/RESULTS.md','docs/ROUTES.md','docs/proofs/hn_unified_framework.md','references/SOURCES.md','references/LITERATURE_MAP.md','certificates/partition_quartet_completeness.json.gz','certificates/partition_quartet_validation.json']
          entries=[]
          for name in paths:
              raw=Path(name).read_bytes();blob=api('/git/blobs',{'content':base64.b64encode(raw).decode(),'encoding':'base64'},'POST')
              entries.append({'path':name,'mode':'100644','type':'blob','sha':blob['sha']})
          entries.append({'path':'.github/quartet-checkpoint.patch','mode':'100644','type':'blob','sha':None})
          tree=api('/git/commits/'+head)['tree']['sha']
          newtree=api('/git/trees',{'base_tree':tree,'tree':entries},'POST')['sha']
          commit=api('/git/commits',{'message':'T127–128 / E098: certify sharp quartet and five-point completeness; preserve all HN UNKNOWNs','tree':newtree,'parents':[head]},'POST')['sha']
          api('/git/refs/heads/'+branch,{'sha':commit,'force':False},'PATCH')
          Path('/tmp/quartet-commit.txt').write_text(commit)
          print('CERTIFIED_COMMIT '+commit)
          PY
      - name: Export the exact final tracked source tree
        run: |
          git fetch --depth=1 origin "$(cat /tmp/quartet-commit.txt)"
          git checkout --detach --force FETCH_HEAD
          test "$(git rev-parse HEAD)" = "$(cat /tmp/quartet-commit.txt)"
          git archive --format=zip HEAD -o "$RUNNER_TEMP/quartet-research-source.zip"
          cp /tmp/quartet-commit.txt "$RUNNER_TEMP/quartet-commit.txt"
          sha256sum "$RUNNER_TEMP/quartet-research-source.zip"
      - name: Store the verified exact workspace snapshot
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: quartet-verified-source
          path: |
            ${{ runner.temp }}/quartet-research-source.zip
            ${{ runner.temp }}/quartet-commit.txt
          retention-days: 7
          if-no-files-found: error
