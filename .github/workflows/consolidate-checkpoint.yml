name: Restore and verify the exact September research checkpoint
on:
  push:
    branches: [research/rotation-integration-20260926]
    paths: [.github/workflows/consolidate-checkpoint.yml]
permissions:
  contents: write
jobs:
  restore:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Fetch the exact public source and its ancestry
        env:
          SOURCE_SHA: ${{ github.sha }}
        run: |
          git init .
          git remote add origin https://github.com/rsgcsg/math-research.git
          git fetch --no-tags origin "$SOURCE_SHA"
          git checkout --detach FETCH_HEAD
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          test "$(git rev-parse --is-shallow-repository)" = false
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13.5'
      - name: Restore exact local commits and every original Git object
        env:
          PYTHONUNBUFFERED: '1'
          SOURCE_SHA: ${{ github.sha }}
        run: |
          cp .maintenance-transfer/restore.py "$RUNNER_TEMP/restore.py"
          python - <<'PY'
          import base64,hashlib,os
          from pathlib import Path
          raw=base64.b64decode(''.join(p.read_text() for p in sorted(Path('.maintenance-transfer').glob('part*.b64'))),validate=True)
          assert hashlib.sha256(raw).hexdigest()=='093e91294bf5551f3e8c7ba66e96098ab4fb7d0f088a1c54bcd81967958fb21d'
          (Path(os.environ['RUNNER_TEMP'])/'objects.json.xz').write_bytes(raw)
          PY
          set -o pipefail
          python -S "$RUNNER_TEMP/restore.py" "$RUNNER_TEMP/objects.json.xz" 2>&1 | tee "$RUNNER_TEMP/restoration.log"
          # The contents-only CI token leaves its own workflow unchanged.
          # The authorized connector removes it after the successful replay.
          git restore --source="$SOURCE_SHA" -- .github/workflows/consolidate-checkpoint.yml
          python - <<'PY'
          import hashlib,json,os
          from pathlib import Path
          files=[Path('Makefile'),Path('requirements-research.txt'),*sorted(Path('research').glob('*.py'))]
          manifest={str(p):hashlib.sha256(p.read_bytes()).hexdigest() for p in files}
          fingerprint=hashlib.sha256(json.dumps(manifest,sort_keys=True,separators=(',',':')).encode()).hexdigest()
          assert len(manifest)==254 and fingerprint=='a7cf5abec5fffbe332a588f88f3d028da8c5264e389962b9e1d5b29e087a3eaa'
          (Path(os.environ['RUNNER_TEMP'])/'restored-sources.json').write_text(json.dumps(manifest,sort_keys=True,indent=2)+'\n')
          PY
      - name: Independently replay T139 E111 and the exact RUP evidence
        env:
          PYTHONUNBUFFERED: '1'
        run: |
          set -o pipefail
          make check-next 2>&1 | tee "$RUNNER_TEMP/check-next.log"
          python - <<'PY'
          import hashlib,json,os
          from pathlib import Path
          expected=json.loads((Path(os.environ['RUNNER_TEMP'])/'restored-sources.json').read_text())
          assert all(hashlib.sha256(Path(p).read_bytes()).hexdigest()==s for p,s in expected.items())
          PY
      - name: Retain the original local commits as genuine merge ancestry
        env:
          SOURCE_SHA: ${{ github.sha }}
          GH_TOKEN: ${{ github.token }}
        run: |
          test -z "$(git diff --name-only)"
          TREE="$(git write-tree)"
          COMMIT="$(printf '%s\n' 'Integrate the exact verified local T139 E111 checkpoint without rewriting its history' | git commit-tree "$TREE" -p "$SOURCE_SHA" -p 875c4f802125f804039ae43586d3c2a8caa19b3d)"
          git checkout --detach "$COMMIT"
          git merge-base --is-ancestor 875c4f802125f804039ae43586d3c2a8caa19b3d HEAD
          AUTH="$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)"
          echo "::add-mask::$AUTH"
          git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic $AUTH" push origin HEAD:refs/heads/research/rotation-integration-20260926
          git rev-parse HEAD > "$RUNNER_TEMP/published-commit.txt"
      - name: Preserve the restoration and independent replay output
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: exact-checkpoint-restoration
          path: |
            ${{ runner.temp }}/restoration.log
            ${{ runner.temp }}/restored-sources.json
            ${{ runner.temp }}/check-next.log
            ${{ runner.temp }}/published-commit.txt
          retention-days: 7
          if-no-files-found: error
