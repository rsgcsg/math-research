name: Transport projection verification
on:
  push:
    branches: [research/transport-projection-20261004]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - name: Fetch exact branch commit without persisted credentials
        env:
          SOURCE_SHA: ${{ github.sha }}
        run: |
          set -eu
          git init .
          git remote add origin https://github.com/rsgcsg/math-research.git
          git fetch --no-tags origin "$SOURCE_SHA"
          git checkout --detach FETCH_HEAD
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          git branch export-snapshot HEAD
          git bundle create "$RUNNER_TEMP/source.bundle" export-snapshot
          git archive --format=zip HEAD > "$RUNNER_TEMP/source.zip"
          git rev-parse HEAD > "$RUNNER_TEMP/checked-commit.txt"
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12.14'
      - name: Reconstruct T160-T161 geometry and verify T162 capacity
        env:
          PYTHONUNBUFFERED: '1'
        run: |
          set -o pipefail
          python3 -S -m compileall -q research
          make check-q-robust-capacity 2>&1 | tee "$RUNNER_TEMP/q-robust-capacity.log"
          python3 -S research/verify_g14_pr_transport_bound.py 2>&1 | tee "$RUNNER_TEMP/pr-bound.log"
          python3 -S research/verify_q_pr_coupling_audit.py 2>&1 | tee "$RUNNER_TEMP/previous-coupling.log"
          git diff --exit-code
      - name: Retain exact source and replay logs
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: transport-projection-t162-replay
          path: |
            ${{ runner.temp }}/source.bundle
            ${{ runner.temp }}/source.zip
            ${{ runner.temp }}/checked-commit.txt
            ${{ runner.temp }}/q-robust-capacity.log
            ${{ runner.temp }}/pr-bound.log
            ${{ runner.temp }}/previous-coupling.log
          retention-days: 30
          if-no-files-found: error
