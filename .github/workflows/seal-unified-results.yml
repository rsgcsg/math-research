name: Seal verified unified research results
on:
  push:
    branches: [maintenance/unified-results-20261006]
    paths: [.github/workflows/seal-unified-results.yml]
permissions:
  contents: write
  actions: write
jobs:
  seal:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - name: Supersede only the pinned waiting seal, never the mathematical replay
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import json,subprocess
          endpoint='repos/rsgcsg/math-research/actions/runs/37435371323'
          r=json.loads(subprocess.check_output(['gh','api',endpoint]))
          assert r['head_sha']=='cfb4209560a48a577311341335efaff9e2cf4efc'
          assert r['path']=='.github/workflows/seal-unified-results.yml'
          if r['status']!='completed':
              subprocess.run(['gh','api','--method','POST',endpoint+'/cancel'],check=True)
          PY
      - name: Fetch exact reviewed source and original archive tags
        env:
          SOURCE_SHA: ${{ github.sha }}
        run: |
          set -eu
          git init .
          git remote add origin https://github.com/rsgcsg/math-research.git
          git fetch --no-tags origin "$SOURCE_SHA" '+refs/tags/*:refs/tags/*'
          git checkout --detach "$SOURCE_SHA"
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13.5'
      - name: Require completion of the current frozen replay
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import json,subprocess,time
          for attempt in range(240):
              r=json.loads(subprocess.check_output(['gh','api','repos/rsgcsg/math-research/actions/runs/37431407795']))
              if r['head_sha']!='7f630ef6686daa078c2aa637b4d6255d81f7ee3f':raise SystemExit('wrong replay source')
              if r['status']=='completed':
                  if r['conclusion']!='success':raise SystemExit('replay did not pass')
                  print('Exact source replay completed successfully');break
              if attempt%4==0:print('Current replay remains '+r['status'],flush=True)
              time.sleep(15)
          else:raise SystemExit('verification dependency remains incomplete')
          PY
      - name: Download exact full-coverage evidence
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh run download 37431407795 --repo rsgcsg/math-research --name consolidated-complete-verification --dir "$RUNNER_TEMP/verified-evidence"
      - name: Independently check records and seal without writing credentials to artifacts
        env:
          GH_TOKEN: ${{ github.token }}
          PYTHONUNBUFFERED: '1'
        run: |
          set -o pipefail
          python3 - <<'PY'
          import os
          from pathlib import Path
          code=Path('.maintenance/seal_integration.py').read_text()
          unsafe="print('::add-mask::'+auth,flush=True)"
          if code.count(unsafe)!=1:raise SystemExit('unexpected authorization logging source')
          code=code.replace(unsafe,'pass  # Authorization stays only in the subprocess environment')
          (Path(os.environ['RUNNER_TEMP'])/'seal_no_credentials.py').write_text(code)
          PY
          python3 -S "$RUNNER_TEMP/seal_no_credentials.py" 2>&1 | tee "$RUNNER_TEMP/seal.log"
      - name: Save actual closeout state and exact Git history
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: sealed-unified-source-and-evidence
          path: |
            ${{ runner.temp }}/sealed
            ${{ runner.temp }}/seal.log
          retention-days: 30
          if-no-files-found: error
