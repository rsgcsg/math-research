name: Dyadic cyclic orbit research

on:
  push:
    branches: [research/cyclic-orbit-20260921]
    paths:
      - research/dyadic_cyclic_orbit_probe.py
      - research/verify_dyadic_cyclic_orbit.py
      - .github/workflows/cyclic-orbit-research.yml

permissions:
  contents: write

jobs:
  orbit:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Fetch the exact public source without stored credentials
        env:
          SOURCE_SHA: ${{ github.sha }}
        run: |
          git init .
          git remote add origin https://github.com/rsgcsg/math-research.git
          git fetch --depth=1 origin "$SOURCE_SHA"
          git checkout --detach FETCH_HEAD
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          python3 --version
      - name: Install search-only dependencies
        run: python3 -m pip install numpy==2.2.6 python-sat==1.9.dev15
      - name: Compute finite exact sieve and search periodic orbit colors
        run: |
          set -o pipefail
          python3 -u research/dyadic_cyclic_orbit_probe.py 2>&1 | tee "$RUNNER_TEMP/cyclic-orbit.log"
      - name: Replay independent checker when present
        run: |
          if test -f research/verify_dyadic_cyclic_orbit.py; then
            python3 -u research/verify_dyadic_cyclic_orbit.py
          fi
      - name: Save explicitly scoped research output
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add certificates/dyadic_cyclic_orbit_probe.json.gz certificates/dyadic_cyclic_orbit_summary.json
          if test -f certificates/dyadic_cyclic_orbit_validation.json; then
            git add certificates/dyadic_cyclic_orbit_validation.json
          fi
          if ! git diff --cached --quiet; then
            git commit -m 'research: record cyclic-orbit experiment with explicit verification scope'
            git -c "http.https://github.com/.extraheader=AUTHORIZATION: bearer $GH_TOKEN" push origin "HEAD:$GITHUB_REF_NAME"
          fi
      - name: Retain experiment log
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: cyclic-orbit-log-${{ github.sha }}
          path: ${{ runner.temp }}/cyclic-orbit.log
          retention-days: 7
          if-no-files-found: warn
