name: Import exact local research history
on:
  push:
    branches: [maintenance/unified-results-20261006]
    paths: [.github/workflows/import-local-history.yml]
permissions:
  contents: write
jobs:
  import:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Fetch public object dependencies and authenticated one-use math source
        env:
          TRANSFER_URL: 'https://sdmntprnznorth.oaiusercontent.com/files/00000000-3570-820b-9911-9ec13073cab0/raw?se=2026-10-06T05%3A43%3A08Z&sp=r&sv=2026-02-06&sr=b&scid=f8216fea-5c83-5c2b-8393-53ce099c3b95&skoid=b7fc319f-b93c-4fac-ba5f-14fdc3f9209f&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-10-06T01%3A43%3A07Z&ske=2026-10-07T01%3A43%3A07Z&sks=b&skv=2026-02-06&sig=5lj4SQo9GM9Zk6TosdWRpNQNrGb8gZWEjqf%2BsWnISVc%3D'
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git init .
          git remote add origin https://github.com/rsgcsg/math-research.git
          git fetch --no-tags origin '+refs/heads/*:refs/remotes/origin/*' '+refs/tags/*:refs/tags/*'
          curl --fail --location --silent --show-error "$TRANSFER_URL" -o "$RUNNER_TEMP/local.pack"
          echo "b8dc1fd68977b1aae8b8bbf41f612fa270816214af0c65d18a995280e5dbf10d  $RUNNER_TEMP/local.pack" | sha256sum --check
          git index-pack --fix-thin --stdin < "$RUNNER_TEMP/local.pack"
          python3 - <<'PY'
          import subprocess,os,json,base64
          entries={'cycle-descent-20260928':'f986eb0a0de1e33769efa54aa73c3eac9d2ff711','motion-packet-20260928':'b532e71453935088000fa54738163c28180b17b8','full15-certified':'86a7f6c53e0d4058fdee6990c6cc2946bbd4fad1','q-defect-capacity-20261006':'3dc223a711cc37dbb610b48f136a5c5308871421'}
          refs={b:a for a,b in (x.split() for x in subprocess.check_output(['git','ls-remote','--refs','origin'],text=True).splitlines())}
          specs=[];flags=[]
          for name,sha in entries.items():
              subprocess.run(['git','cat-file','-e',sha+'^{commit}'],check=True)
              ref='refs/tags/archive/2026-10-06/local/'+name
              if ref in refs:
                  if refs[ref]!=sha:raise RuntimeError('conflicting archive: '+ref)
              else:
                  specs.append(sha+':'+ref);flags.append('--force-with-lease='+ref+':')
          subprocess.run(['git','fsck','--full','--no-dangling'],check=True)
          if specs:
              auth=base64.b64encode(('x-access-token:'+os.environ['GH_TOKEN']).encode()).decode()
              print('::add-mask::'+auth,flush=True)
              env=os.environ.copy();env.update(GIT_CONFIG_COUNT='1',GIT_CONFIG_KEY_0='http.https://github.com/.extraheader',GIT_CONFIG_VALUE_0='AUTHORIZATION: basic '+auth)
              subprocess.run(['git','push','--atomic',*flags,'origin',*specs],env=env,check=True)
          after={b:a for a,b in (x.split() for x in subprocess.check_output(['git','ls-remote','--refs','origin'],text=True).splitlines())}
          for name,sha in entries.items():
              assert after['refs/tags/archive/2026-10-06/local/'+name]==sha
          print(json.dumps({'status':'EXACT_LOCAL_HISTORY_PRESERVED','commits':entries,'scope':'Archive refs only; main unchanged; no verification claim.'}),flush=True)
          PY
