name: Verify binary POVM threshold
on:
  push:
    branches: [research/povm-vector-threshold-20261008]
    paths: [.github/workflows/binary-povm-seal.yml]
permissions:
  contents: write
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Fetch exact reviewed public source and preserved tags
        env:
          SOURCE_SHA: ${{ github.sha }}
        run: |
          set -eu
          git init .
          git remote add origin https://github.com/rsgcsg/math-research.git
          git fetch --no-tags origin "$SOURCE_SHA" '+refs/tags/*:refs/tags/*'
          git checkout --detach "$SOURCE_SHA"
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13.5'
      - name: Replay exact evidence and preserve bounded full-check outcome
        env:
          GH_TOKEN: ${{ github.token }}
          PYTHONUNBUFFERED: '1'
        run: |
          set -o pipefail
          python3 -S .maintenance/seal_binary.py 2>&1 | tee "$RUNNER_TEMP/seal.log"
      - name: Preserve actual outputs and published source
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: binary-povm-verified-source
          path: |
            ${{ runner.temp }}/published
            ${{ runner.temp }}/seal.log
            certificates/binary_povm_remote
          if-no-files-found: error
          retention-days: 30
