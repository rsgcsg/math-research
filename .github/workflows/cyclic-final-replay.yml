name: Cyclic orbit complete repository replay

on:
  push:
    branches: [research/cyclic-orbit-20260921]
    paths: [.github/workflows/cyclic-final-replay.yml]

permissions:
  contents: write

jobs:
  replay:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - name: Fetch exact source without persisted credentials
        env:
          SOURCE_SHA: ${{ github.sha }}
        run: |
          git init .
          git remote add origin https://github.com/rsgcsg/math-research.git
          git fetch --depth=1 origin "$SOURCE_SHA"
          git checkout --detach FETCH_HEAD
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          python3 --version
      - name: Append scoped results without replacing historical ledgers
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          from pathlib import Path
          marker='2026-09-21：T129–130 / E100'
          additions={
            'docs/RESULTS.md': '\n\n## '+marker+'\n\n| ID | 内容 | 状态 | 证据/范围 |\n|---|---|---|---|\n| T129 | 给定有限代数点集与代数单位旋转的实际全循环轨道可染性可有效化为有限状态；非零有限赋值至多两个指数候选，其他非扭转情形用阿基米德共轭尾界 | 完整证明；Q(i)24025项有限校准 | [证明](proofs/dyadic_cyclic_orbit.md)；单生成元，不给全HN统一规模或多生成元周期性 |\n| T130 | O=全部整数幂u作用于Y的实际单位图恰五色，最小标号周期3；同索引实际u²单位边排除周期1/2 | 完整无限量词证明与独立正证书 | [证明](proofs/dyadic_cyclic_orbit.md)；覆盖全部重合/跨边；新三相律旧14域全部失配，原共同律仍未知 |\n| E100 | 穷尽全部u幂：正返回29/805/5，n≥4仅原点；非原点跨边层差仅0至4；27745点143817边三周期商有五色正词 | 两种数域算术独立验证；14种篡改拒绝、-O拒绝 | [证据](../certificates/dyadic_cyclic_orbit_validation.json)；63129接触代表加360原点邻接，190467边颜色检查；非HN新界 |\n',
            'docs/ROUTES.md': '\n\n## '+marker+'\n\nT116/E090/E092 → T129的全部指数有效筛选 → T130整个实际循环O恰五色。\n只增加u幂的NON5分支已关闭，不再以更多幂次/周期预算重开。\n下一共同律必须真正混合其他运动并保留全部旧义务；新三相律的旧14域全部失配。\nE084/E097/E099仍为各自历史UNKNOWN。一般单代数旋转的有限状态完备性不推广为多生成元周期性。\n详见[完整证明](proofs/dyadic_cyclic_orbit.md)及[CURRENT](CURRENT.md)。\n',
            'docs/proofs/hn_unified_framework.md': '\n\n## '+marker+'：真实循环轨道而非一步条带\n\n[T129–130](dyadic_cyclic_orbit.md)精确填补E090的真实轨道缺口：全部回入和跨层单位边可有效穷尽，整个O=∪uⁿY恰五色，最小标号周期3。\n周期正解给所有u幂的完整共同律，但旧14完整域逐项均失配。\n因此当前活动主线仍是多运动相容性，不是继续添加u的高次幂。\n单旋转的可计算有限状态判定不提供整个平面的共尾构造。\n',
            'certificates/README.md': '\n\n## '+marker+'\n\n`dyadic_cyclic_orbit_probe.json.gz` 保存全部精确返回、63129个非原点接触代表、360个原点邻接和三份10077字符五色词。\n独立入口 `python3 research/verify_dyadic_cyclic_orbit.py`；结果为 `dyadic_cyclic_orbit_validation.json`。\n`dyadic_cyclic_orbit_summary.json` 是搜索摘要，不代替独立检查。\n证书SHA256：79d1448921c3d66604d847d617dec496245e82393a3b7a8ea373ae2c9af3a172。\n`cyclic_orbit_full_regression.json` 仅在本次完整make check成功后生成，绑定受检提交与源码指纹。\n',
            'references/SOURCES.md': '\n\n## '+marker+'：来源审查\n\n主要输入为仓库T116/E077/E090/E092，新增赋值和有限状态论证均在proof中完整证明。\n2026-09-21读取 https://arxiv.org/abs/2608.04542 可见版本为2026-08-06 v2（2131点spindle-free五色），不作为普通六色界。\nVille Salo, DOI 10.1112/plms.12567：本轮可读摘要/索引，出版社全文403；不把该文主定理列为已读证明输入。\n'
          }
          for name,addition in additions.items():
              p=Path(name);old=p.read_text()
              if marker not in old:
                  if name=='docs/RESULTS.md':assert '| T129 |' not in old and '| T130 |' not in old
                  p.write_text(old.rstrip()+addition)
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/RESULTS.md docs/ROUTES.md docs/proofs/hn_unified_framework.md certificates/README.md references/SOURCES.md
          if ! git diff --cached --quiet; then
            git commit -m 'docs: integrate T129-T130 and retire only the certified single-u branch'
            AUTH=$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)
            echo "::add-mask::$AUTH"
            git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic $AUTH" push origin "HEAD:$GITHUB_REF_NAME"
          fi
          echo "CHECKED_COMMIT=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
          git ls-tree -r HEAD -- research Makefile requirements-research.txt > "$RUNNER_TEMP/research-source-manifest.txt"
          sha256sum "$RUNNER_TEMP/research-source-manifest.txt"
          test -z "$(git config --local --get-regexp 'extraheader|credential' || true)"
          tar -czf "$RUNNER_TEMP/research-workspace-before.tar.gz" .
      - name: Export exact source and Git metadata
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: cyclic-research-workspace-before-${{ github.sha }}
          path: ${{ runner.temp }}/research-workspace-before.tar.gz
          retention-days: 7
          if-no-files-found: error
      - name: Run every original and new independent check
        run: |
          set -o pipefail
          make check 2>&1 | tee "$RUNNER_TEMP/cyclic-full-regression.log"
          git diff --exit-code -- research Makefile requirements-research.txt
      - name: Bind the full PASS to exact checked source
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import hashlib,json,os,platform,subprocess
          temp=Path(os.environ['RUNNER_TEMP'])
          manifest=(temp/'research-source-manifest.txt').read_bytes()
          assert manifest==subprocess.check_output(['git','ls-tree','-r','HEAD','--','research','Makefile','requirements-research.txt'])
          cert=Path('certificates/dyadic_cyclic_orbit_probe.json.gz')
          data=dict(status='PASS',command='make check',checked_commit=os.environ['CHECKED_COMMIT'],
            source_manifest_sha256=hashlib.sha256(manifest).hexdigest(),
            cyclic_certificate_sha256=hashlib.sha256(cert.read_bytes()).hexdigest(),
            log_sha256=hashlib.sha256((temp/'cyclic-full-regression.log').read_bytes()).hexdigest(),
            python=platform.python_version(),source_unchanged=True,
            scope='All original verify.py checks plus Salem, quartet and complete cyclic-orbit checks; mathematical general theorem uses its written proof',
            worktree_outputs=subprocess.check_output(['git','diff','--name-only'],text=True).splitlines())
          Path('certificates/cyclic_orbit_full_regression.json').write_text(json.dumps(data,indent=2)+'\n')
          p=Path('docs/CURRENT.md');s=p.read_text()
          marker='全仓回归状态：待本分支完整工作流收据；已通过的是E100新增独立验证。'
          assert marker in s
          s=s.replace(marker,'全仓回归状态：完整 `make check` 已通过，研究源码保持不变；受检提交为 `'+data['checked_commit']+'`。详见[绑定收据](../certificates/cyclic_orbit_full_regression.json)。')
          p.write_text(s)
          print(json.dumps(data,indent=2))
          PY
          git add docs/CURRENT.md certificates/dyadic_cyclic_orbit_validation.json certificates/cyclic_orbit_full_regression.json
          git commit -m 'verification: bind complete repository PASS to frozen cyclic-orbit research source'
          AUTH=$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)
          echo "::add-mask::$AUTH"
          git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic $AUTH" push origin "HEAD:$GITHUB_REF_NAME"
          tar -czf "$RUNNER_TEMP/research-workspace-final.tar.gz" .
      - name: Save final workspace and full regression evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: cyclic-full-regression-${{ github.sha }}
          path: |
            ${{ runner.temp }}/cyclic-full-regression.log
            ${{ runner.temp }}/research-source-manifest.txt
            ${{ runner.temp }}/research-workspace-final.tar.gz
            certificates/cyclic_orbit_full_regression.json
            certificates/dyadic_cyclic_orbit_validation.json
          retention-days: 7
          if-no-files-found: warn
