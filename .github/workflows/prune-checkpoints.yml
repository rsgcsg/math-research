name: Archive verified research branches once
on:
  push:
    branches: [main]
    paths: [.github/workflows/prune-checkpoints.yml]
permissions:
  contents: write
  pull-requests: read
  actions: read
jobs:
  archive:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Fetch the exact public main with full ancestry
        env:
          SOURCE_SHA: ${{ github.sha }}
        run: |
          git init .
          git remote add origin https://github.com/rsgcsg/math-research.git
          git fetch --no-tags origin "$SOURCE_SHA"
          git checkout --detach FETCH_HEAD
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          test "$(git rev-parse --is-shallow-repository)" = false
      - name: Verify explicit heads and atomically archive and remove them
        env:
          GH_TOKEN: ${{ github.token }}
          PRUNE_TARGETS_JSON: '[{"branch":"research/birank-rotation-20260921","expected_sha":"a658761d00ce0395242faace7e8e0db9a1bb16ee","archive_tag":"archive/2026-09-22/research/birank-rotation-20260921","disposition":"merged_before_deletion"},{"branch":"research/checkpoint-audit-20260921","expected_sha":"a61cdfce8f93878c300718f1a8fe806d60e8ca11","archive_tag":"archive/2026-09-22/research/checkpoint-audit-20260921","disposition":"merged_before_deletion"},{"branch":"research/consolidated-20260921","expected_sha":"00c43b5f6e9a3af06ac3e9e5263b1c27a6026ed8","archive_tag":"archive/2026-09-22/research/consolidated-20260921","disposition":"merged_before_deletion"},{"branch":"research/cyclic-orbit-20260921","expected_sha":"a658761d00ce0395242faace7e8e0db9a1bb16ee","archive_tag":"archive/2026-09-22/research/cyclic-orbit-20260921","disposition":"merged_before_deletion"},{"branch":"research/full-joint-20260919","expected_sha":"fcea973ad8c05b4b5f2d3fa28ed7977aebf645ae","archive_tag":"archive/2026-09-22/research/full-joint-20260919","disposition":"merged_before_deletion"},{"branch":"research/full-law-loop-20260922","expected_sha":"bc1ac3a1bb486f0b17a495b48c385c9711b5ea46","archive_tag":"archive/2026-09-22/research/full-law-loop-20260922","disposition":"merged_before_deletion"},{"branch":"research/full-law-pricing-20260921","expected_sha":"5cd52cea0bfa5ac8ed25e1e1ca04e8b7654cdc7b","archive_tag":"archive/2026-09-22/research/full-law-pricing-20260921","disposition":"archive_only_preparation","allowed_unmerged_paths":[".github/workflows/full-law-pricing.yml"]},{"branch":"research/joint-pair-cegar-20260920","expected_sha":"5cd6b56373e9e92d686101a87028e213747feaf2","archive_tag":"archive/2026-09-22/research/joint-pair-cegar-20260920","disposition":"merged_before_deletion"},{"branch":"research/sextic-four-color-20260919","expected_sha":"404dd1d1965f31f5bba3dbab8fea44e51d2fce73","archive_tag":"archive/2026-09-22/research/sextic-four-color-20260919","disposition":"merged_before_deletion"},{"branch":"maintenance/branch-cleanup-20260922","expected_sha":"dc43a72d6f34209f88022faeb898d3c886412011","disposition":"merged_before_deletion"}]'
        run: |
          python - <<'PY'
          """One-use, explicit, archive-first branch maintenance; no mathematical claims."""
          import base64
          from datetime import datetime, timezone
          import json
          import os
          from pathlib import Path
          import re
          import subprocess
          from urllib.request import Request, urlopen

          REPO = 'rsgcsg/math-research'
          TAG_PREFIX = 'refs/tags/archive/2026-09-22/'


          def git(*args, env=None):
              return subprocess.check_output(['git', *args], env=env, text=True).strip()


          def refs():
              return {ref: sha for sha, ref in (line.split() for line in git('ls-remote', '--refs', 'origin').splitlines())}


          def guard_plan(snapshot, targets, main_sha, ancestor, changed_files, open_heads, active_heads):
              if snapshot.get('refs/heads/main') != main_sha:
                  raise RuntimeError('main moved; re-read before proceeding')
              names = [t['branch'] for t in targets]
              if len(names) != len(set(names)):
                  raise RuntimeError('duplicate target')
              records = []
              for t in targets:
                  b, sha = t['branch'], t['expected_sha']
                  if not b.startswith(('research/', 'maintenance/')) or not re.fullmatch('[0-9a-f]{40}', sha):
                      raise RuntimeError('invalid or protected target')
                  head, tag = 'refs/heads/' + b, TAG_PREFIX + b
                  if b in open_heads or b in active_heads:
                      raise RuntimeError('open PR or running workflow: ' + b)
                  if tag in snapshot and snapshot[tag] != sha:
                      raise RuntimeError('archive tag differs: ' + b)
                  if head not in snapshot:
                      if snapshot.get(tag) != sha:
                          raise RuntimeError('missing branch without exact archive: ' + b)
                      records.append(dict(branch=b, expected_sha=sha, archive_tag=tag[len('refs/tags/'):],
                                          result='ALREADY_ARCHIVED_AND_DELETED', new_tag=False, delete=False))
                      continue
                  if snapshot[head] != sha:
                      raise RuntimeError('branch changed: ' + b)
                  merged = ancestor(sha, main_sha)
                  if not merged:
                      allowed = t.get('allowed_unmerged_paths')
                      if t.get('disposition') != 'archive_only_preparation' or not allowed or sorted(changed_files(sha, main_sha)) != sorted(allowed):
                          raise RuntimeError('unmerged unique work: ' + b)
                  records.append(dict(branch=b, expected_sha=sha, archive_tag=tag[len('refs/tags/'):],
                                      result='ARCHIVE_AND_DELETE', ancestor_of_main=merged,
                                      disposition=t['disposition'], new_tag=tag not in snapshot, delete=True))
              return records


          def api_pages(path, key=None):
              results = []
              token = os.environ['GH_TOKEN']
              for page in range(1, 101):
                  url = f'https://api.github.com/repos/{REPO}/{path}'
                  url += ('&' if '?' in url else '?') + f'per_page=100&page={page}'
                  req = Request(url, headers={'Authorization': 'Bearer ' + token,
                                               'Accept': 'application/vnd.github+json',
                                               'X-GitHub-Api-Version': '2022-11-28'})
                  with urlopen(req, timeout=40) as response:
                      data = json.load(response)
                  batch = data[key] if key else data
                  results.extend(batch)
                  if len(batch) < 100:
                      return results
              raise RuntimeError('pagination incomplete')


          def main():
              if os.environ.get('GITHUB_REPOSITORY') != REPO or os.environ.get('GITHUB_REF') != 'refs/heads/main':
                  raise RuntimeError('wrong repository or branch')
              sha = os.environ['GITHUB_SHA']
              targets = json.loads(os.environ['PRUNE_TARGETS_JSON'])
              before = refs()
              if before.get('refs/heads/main') != sha:
                  raise RuntimeError('main changed before cleanup')
              subprocess.run(['git', 'fetch', '--no-tags', 'origin', '+refs/heads/*:refs/remotes/origin/*'], check=True)
              opened = api_pages('pulls?state=open')
              # Protect both source and base branches of open pull requests.
              open_heads = {p[side]['ref'] for p in opened for side in ('head', 'base')
                            if p[side]['repo'] and p[side]['repo']['full_name'] == REPO}
              runs = api_pages('actions/runs', 'workflow_runs')
              active = {x['head_branch'] for x in runs if x['status'] != 'completed'
                        and str(x['id']) != os.environ['GITHUB_RUN_ID']}
              def ancestor(a, b):
                  result = subprocess.run(['git', 'merge-base', '--is-ancestor', a, b])
                  if result.returncode not in (0, 1):
                      raise RuntimeError('cannot establish ancestry')
                  return result.returncode == 0
              def differences(a, b):
                  return git('diff', '--name-only', b + '...' + a).splitlines()
              records = guard_plan(before, targets, sha, ancestor, differences, open_heads, active)
              # Repeat the ref check immediately before the lease-protected atomic push.
              guard_plan(refs(), targets, sha, ancestor, differences, open_heads, active)
              flags, specs = [], []
              for record in records:
                  b, s = record['branch'], record['expected_sha']
                  tag = 'refs/tags/' + record['archive_tag']
                  if record['new_tag']:
                      flags.append('--force-with-lease=' + tag + ':')
                      specs.append(s + ':' + tag)
                  if record['delete']:
                      flags.append('--force-with-lease=refs/heads/' + b + ':' + s)
                      specs.append(':refs/heads/' + b)
              if specs:
                  auth = base64.b64encode(('x-access-token:' + os.environ['GH_TOKEN']).encode()).decode()
                  print('::add-mask::' + auth, flush=True)
                  env = os.environ.copy()
                  env.update(GIT_CONFIG_COUNT='1', GIT_CONFIG_KEY_0='http.https://github.com/.extraheader',
                             GIT_CONFIG_VALUE_0='AUTHORIZATION: basic ' + auth)
                  subprocess.run(['git', 'push', '--atomic', '--porcelain', *flags, 'origin', *specs],
                                 env=env, check=True)
              after = refs()
              for record in records:
                  if 'refs/heads/' + record['branch'] in after:
                      raise RuntimeError('target branch still present')
                  if after.get('refs/tags/' + record['archive_tag']) != record['expected_sha']:
                      raise RuntimeError('archive mismatch after push')
                  record['result'] = 'ARCHIVED_AND_DELETED'
                  del record['new_tag']; del record['delete']
              unexpected_deletions = {k for k in before if k.startswith('refs/heads/') and k not in after} - {'refs/heads/' + t['branch'] for t in targets}
              if unexpected_deletions:
                  raise RuntimeError('unrelated ref changed; inspect concurrent writer')
              report = dict(schema='hn-branch-archive-v1', date='2026-09-22', status='PASS',
                            timestamp_utc=datetime.now(timezone.utc).isoformat(),
                            cleanup_run=os.environ['GITHUB_RUN_ID'], checked_main=sha,
                            baseline_main='53feae233ab7d781b3ca32242fabfabfb9cde3d4',
                            integrated_research_tip='bc1ac3a1bb486f0b17a495b48c385c9711b5ea46',
                            branches=records,
                            branches_before={k[len('refs/heads/'):]:v for k,v in before.items() if k.startswith('refs/heads/')},
                            branches_after={k[len('refs/heads/'):]:v for k,v in after.items() if k.startswith('refs/heads/')},
                            guards=['explicit-whitelist','exact-head-SHA','merged-ancestry-or-explicit-preparation-only-diff',
                                    'no-open-PR','no-unfinished-workflow','archive-tag-conflict-check',
                                    'atomic-archive-and-delete','per-ref-expected-SHA-leases','remote-readback'],
                            scope='Git reference maintenance only. Historical commits are retained by tags; no theorem or search status is changed.')
              out = Path(os.environ['RUNNER_TEMP'])/'branch-cleanup-report.json'
              out.write_text(json.dumps(report, ensure_ascii=False, indent=2)+'\n')
              print(json.dumps({'status':'PASS','archived':len(records),'remaining':sorted(report['branches_after'])}), flush=True)


          if __name__ == '__main__':
              main()
          PY
      - name: Export the actual deletion receipt
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: branch-cleanup-receipt
          path: ${{ runner.temp }}/branch-cleanup-report.json
          retention-days: 7
          if-no-files-found: error
