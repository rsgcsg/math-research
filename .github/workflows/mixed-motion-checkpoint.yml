name: Mixed-motion checkpoint verification
on:
  push:
    branches: [research/mixed-motion-20260929]
    paths: [.github/workflows/mixed-motion-checkpoint.yml]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  replay:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Fetch exact source without persisted credentials
        env:
          SOURCE_SHA: ${{ github.sha }}
        run: |
          set -eu
          git init .
          git remote add origin https://github.com/rsgcsg/math-research.git
          git fetch --no-tags origin "$SOURCE_SHA"
          git checkout --detach FETCH_HEAD
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          git branch export-snapshot HEAD
          git bundle create "$RUNNER_TEMP/source.bundle" export-snapshot
          git archive --format=zip HEAD > "$RUNNER_TEMP/source.zip"
          git rev-parse HEAD > "$RUNNER_TEMP/checked-commit.txt"
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13.5'
      - name: Independent triangular-lattice and inherited eta checks
        env:
          PYTHONUNBUFFERED: '1'
        run: |
          set -o pipefail
          python3 -S research/verify_triangular_lattice.py 2>&1 | tee "$RUNNER_TEMP/triangular-check.log"
          make check-eta-support 2>&1 | tee "$RUNNER_TEMP/eta-check.log"
          git diff --exit-code
      - name: Preserve source and actual outputs
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: mixed-motion-source-and-replay
          path: |
            ${{ runner.temp }}/source.bundle
            ${{ runner.temp }}/source.zip
            ${{ runner.temp }}/checked-commit.txt
            ${{ runner.temp }}/triangular-check.log
            ${{ runner.temp }}/eta-check.log
          retention-days: 30
          if-no-files-found: error
