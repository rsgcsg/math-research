name: Bounded full-joint pair CEGAR
on:
  push:
    branches: [research/joint-pair-cegar-20260920]
    paths:
      - research/joint_pair_cegar.py
      - .github/workflows/joint-pair-cegar.yml
permissions:
  contents: write
jobs:
  search:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Read the exact public source without storing credentials
        env:
          SOURCE_SHA: ${{ github.sha }}
        run: |
          git init .
          git remote add origin https://github.com/rsgcsg/math-research.git
          git fetch --depth=1 origin "$SOURCE_SHA"
          git checkout --detach FETCH_HEAD
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          python3 --version
          python3 -m pip install --disable-pip-version-check --only-binary=:all: python-sat==1.9.dev15
      - name: Run a single globally bounded free-support-five search
        run: |
          set -o pipefail
          python3 -u research/joint_pair_cegar.py --budget 300000 --rounds 250 --seconds 600 | tee /tmp/joint-pair-cegar.log
      - name: Independently check any saved positive full-domain witness
        run: python3 -u research/verify_joint_pair_cegar.py
      - name: Archive only the experiment and verification receipts on this branch
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_SHA: ${{ github.sha }}
          TARGET_BRANCH: research/joint-pair-cegar-20260920
        run: |
          python3 - <<'PY'
          import base64,json,os,urllib.request
          from pathlib import Path
          base='https://api.github.com/repos/rsgcsg/math-research'
          headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'],'Accept':'application/vnd.github+json','X-GitHub-Api-Version':'2022-11-28'}
          def api(path,data=None,method=None):
              req=urllib.request.Request(base+path,data=None if data is None else json.dumps(data).encode(),headers=headers,method=method)
              with urllib.request.urlopen(req,timeout=30) as response:return json.load(response)
          branch=os.environ['TARGET_BRANCH'];head=api('/git/ref/heads/'+branch)['object']['sha']
          if head!=os.environ['SOURCE_SHA']:raise SystemExit('Branch moved; do not overwrite newer work')
          cert=Path('certificates/joint_pair_cegar.json')
          data=json.loads(cert.read_text());data['source_commit']=head;cert.write_text(json.dumps(data,indent=2)+'\n')
          # Source binding modifies the payload bytes, not any mathematics.
          import hashlib
          report_path=Path('certificates/joint_pair_cegar_validation.json')
          report=json.loads(report_path.read_text());report['certificate_sha256']=hashlib.sha256(cert.read_bytes()).hexdigest()
          report['source_commit']=head;report_path.write_text(json.dumps(report,indent=2)+'\n')
          tree=api('/git/commits/'+head)['tree']['sha'];entries=[]
          for path in (cert,report_path):
              blob=api('/git/blobs',{'content':base64.b64encode(path.read_bytes()).decode(),'encoding':'base64'},'POST')
              entries.append({'path':str(path),'mode':'100644','type':'blob','sha':blob['sha']})
          newtree=api('/git/trees',{'base_tree':tree,'tree':entries},'POST')['sha']
          status=data['search']['status'];domains=0 if data['result'] is None else data['result']['full_domain_count']
          commit=api('/git/commits',{'message':f'E097: archive bounded CEGAR {status}, certified domains={domains}','tree':newtree,'parents':[head]},'POST')['sha']
          api('/git/refs/heads/'+branch,{'sha':commit,'force':False},'PATCH')
          print('ARCHIVED_COMMIT '+commit)
          print('ARCHIVED_STATUS '+status+' POSITIVE_DOMAINS '+str(domains))
          PY
