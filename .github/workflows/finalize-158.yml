name: Final radical-transfer checks
on:
  push:
    branches: [research/openai-158-audit-20261007]
    paths: [.github/workflows/finalize-158.yml]
permissions:
  contents: write
  actions: read
jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Fetch exact reviewed project source and preserved tags
        env:
          SOURCE_SHA: ${{ github.sha }}
        run: |
          set -eu
          git init .
          git remote add origin https://github.com/rsgcsg/math-research.git
          git fetch --no-tags origin "$SOURCE_SHA" '+refs/tags/*:refs/tags/*'
          git checkout --detach "$SOURCE_SHA"
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13.5'
      - name: Retrieve pinned original source for byte audit only
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh run download 37572850907 --repo rsgcsg/math-research --name family158-pinned-source --dir "$RUNNER_TEMP/upstream"
      - name: Verify reviewed results and preserve actual receipts
        env:
          GH_TOKEN: ${{ github.token }}
          PYTHONUNBUFFERED: '1'
        run: |
          set -o pipefail
          python3 -S .maintenance/finalize_158.py 2>&1 | tee "$RUNNER_TEMP/finalization.log"
      - name: Preserve actual source and output, including failures
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: family158-final-reviewed
          path: |
            ${{ runner.temp }}/final
            ${{ runner.temp }}/finalization.log
            certificates/radical_template_replay
          retention-days: 30
          if-no-files-found: error
