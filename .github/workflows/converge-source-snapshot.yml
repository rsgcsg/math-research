name: Convergence source snapshot
on:
  push:
    branches: [maintenance/converged-20261007]
    paths: [.github/workflows/converge-source-snapshot.yml]
permissions:
  contents: read
  pull-requests: read
  actions: read
jobs:
  snapshot:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Preserve exact public Git objects and observed metadata only
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          git init .
          git remote add origin https://github.com/rsgcsg/math-research.git
          git ls-remote --refs origin > "$RUNNER_TEMP/refs-before.txt"
          git fetch --no-tags origin '+refs/heads/*:refs/remotes/origin/*' '+refs/tags/*:refs/tags/*'
          git checkout --detach "$SOURCE_SHA"
          git bundle create "$RUNNER_TEMP/remote-history.bundle" --all
          git fsck --full --no-dangling
          git ls-remote --refs origin > "$RUNNER_TEMP/refs-after.txt"
          gh api --paginate 'repos/rsgcsg/math-research/pulls?state=open&per_page=100' --slurp > "$RUNNER_TEMP/open-pulls.json"
          gh api --paginate 'repos/rsgcsg/math-research/actions/runs?per_page=100' --slurp > "$RUNNER_TEMP/runs.json"
          sha256sum "$RUNNER_TEMP/remote-history.bundle" > "$RUNNER_TEMP/bundle.sha256"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: convergence-remote-source
          path: |
            ${{ runner.temp }}/remote-history.bundle
            ${{ runner.temp }}/refs-before.txt
            ${{ runner.temp }}/refs-after.txt
            ${{ runner.temp }}/open-pulls.json
            ${{ runner.temp }}/runs.json
            ${{ runner.temp }}/bundle.sha256
          retention-days: 30
          if-no-files-found: error
