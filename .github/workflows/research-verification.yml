name: Research certificate replay

on:
  push:
    branches: [research/full-joint-20260919]

permissions:
  contents: read

jobs:
  replay:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - name: Fetch the exact public commit without persisted credentials
        env:
          SOURCE_SHA: ${{ github.sha }}
        run: |
          git init .
          git remote add origin https://github.com/rsgcsg/math-research.git
          git fetch --depth=1 origin "$SOURCE_SHA"
          git checkout --detach FETCH_HEAD
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          python3 --version
          git archive --format=zip HEAD -o "$RUNNER_TEMP/research-source.zip"
          sha256sum "$RUNNER_TEMP/research-source.zip"
      - name: Export the exact tracked source tree
        if: ${{ !contains(github.event.head_commit.message, '[bootstrap]') }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: research-source-${{ github.sha }}
          path: ${{ runner.temp }}/research-source.zip
          retention-days: 7
          if-no-files-found: error
      - name: Export the pinned search-only CPython 3.13 dependency
        if: ${{ contains(github.event.head_commit.message, '[bootstrap]') }}
        run: |
          python3 -m pip download --dest "$RUNNER_TEMP/hn-wheelhouse" --only-binary=:all: --python-version=313 --implementation=cp --abi=cp313 --no-deps python-sat==1.9.dev15
          sha256sum "$RUNNER_TEMP/hn-wheelhouse"/*
      - name: Save the dependency artifact
        if: ${{ contains(github.event.head_commit.message, '[bootstrap]') }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: research-search-wheel
          path: ${{ runner.temp }}/hn-wheelhouse/*
          retention-days: 1
          if-no-files-found: error
      - name: Replay the new Salem certificates
        run: make check-salem
      - name: Replay the complete repository
        if: ${{ !contains(github.event.head_commit.message, '[bootstrap]') }}
        run: |
          set -o pipefail
          make check 2>&1 | tee "$RUNNER_TEMP/research-check.log"
      - name: Save the full regression log
        if: ${{ always() && !contains(github.event.head_commit.message, '[bootstrap]') }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: research-regression-${{ github.sha }}
          path: ${{ runner.temp }}/research-check.log
          retention-days: 7
          if-no-files-found: warn
