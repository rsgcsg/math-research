name: Compact target and mixing verification
on:
  push:
    branches: [research/compact-mixing-transfer-20261007]
    paths: [.github/workflows/compact-mixing-publish.yml]
permissions:
  contents: write
  actions: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Fetch exact project source without stored credentials
        env:
          SOURCE_SHA: ${{ github.sha }}
        run: |
          set -eu
          git init .
          git remote add origin https://github.com/rsgcsg/math-research.git
          git fetch --no-tags origin "$SOURCE_SHA"
          git checkout --detach "$SOURCE_SHA"
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13.5'
      - name: Recover pinned reviewed tree, independently replay, and publish only exact results
        env:
          GH_TOKEN: ${{ github.token }}
          PYTHONUNBUFFERED: '1'
        run: |
          set -o pipefail
          python3 - <<'PY' 2>&1 | tee "$RUNNER_TEMP/verification.log"
          import base64,hashlib,json,lzma,os,subprocess,time
          from pathlib import Path
          BASE='243c3fb7901e9ad21c7321481efc3714d1e6e2c6'
          LOCAL='a314954103af4fa2297a0446064179dfce53a474'
          TREE='41af9b70a5c7c662a9b8a69afe5935cee02b3391'
          BRANCH='research/compact-mixing-transfer-20261007'
          WORKFLOW='.github/workflows/compact-mixing-publish.yml'
          source=os.environ['GITHUB_SHA']; root=Path.cwd(); tmp=Path(os.environ['RUNNER_TEMP'])
          def require(ok,msg):
              if not ok:raise RuntimeError(msg)
          def sha(b):return hashlib.sha256(b).hexdigest()
          def git(*a,input=None):return subprocess.check_output(['git',*a],input=input).decode().strip()
          def save(p,x):p.write_text(json.dumps(x,ensure_ascii=False,indent=2)+'\n')
          require(os.environ['GITHUB_REPOSITORY']=='rsgcsg/math-research','wrong repository')
          require(os.environ['GITHUB_REF']=='refs/heads/'+BRANCH,'wrong branch')
          require(git('rev-parse',source+'^')==BASE,'unexpected workflow parent')
          ids=['40e196464d8fedc27cc33afef4d363e899b5aa13','b84702af5c2de1e94e28d82c57d856ecdf2dbc5e','3d65127e17788b84700af7457fb3e1d26ba5c2bd']
          parts=[]
          for s in ids:
              b=json.loads(subprocess.check_output(['gh','api','repos/rsgcsg/math-research/git/blobs/'+s]))
              raw=base64.b64decode(b['content'])
              require(len(raw)==14348 and hashlib.sha1(b'blob '+str(len(raw)).encode()+b'\0'+raw).hexdigest()==s,'blob identity')
              parts.append(raw)
          packed=b''.join(parts)
          require(sha(packed)=='8cc6e8b82aff95df9096e299f5b0296a1d65c9c05dabcf501239e281a5b5550c','transport hash')
          raw=lzma.decompress(packed,memlimit=256*1024*1024)
          require(len(raw)==147851 and sha(raw)=='bc3a08f23a72e228937b36234cf6d6812dc1ec8cbc59160a1a0b25744fd0a3d9','patch identity')
          patch=tmp/'reviewed.patch';patch.write_bytes(raw)
          paths=[s[6:] for s in raw.decode().splitlines() if s.startswith('+++ b/')]
          require(len(paths)==25 and len(set(paths))==25,'patch path count')
          require(all(not Path(p).is_absolute() and '..' not in Path(p).parts and not p.startswith('.github/') for p in paths),'unsafe path')
          subprocess.run(['git','apply','--check',str(patch)],check=True)
          subprocess.run(['git','apply',str(patch)],check=True)
          subprocess.run(['git','add','-f','--',*paths],check=True)
          subprocess.run(['git','rm','--',WORKFLOW],check=True)
          require(git('write-tree')==TREE,'reviewed full tree mismatch')
          original=base64.b64decode('')
          require(git('hash-object','-w','-t','commit','--stdin',input=original)==LOCAL,'original local commit mismatch')
          local_receipt=json.loads(Path('certificates/compact_mixing_validation.json').read_text())
          require(local_receipt['full_make_check_passed'] is False and local_receipt['full_make_attempt']['returncode']==124,'historical timeout changed')
          for p,s in local_receipt['files'].items():require(sha(Path(p).read_bytes())==s,'local receipt source mismatch: '+p)
          for row in local_receipt['commands']:
              require(sha(Path(row['log']).read_bytes())==row['sha256'],'local log mismatch')
          r=local_receipt['full_make_attempt'];require(sha(Path(r['log']).read_bytes())==r['sha256'],'timeout log mismatch')
          inherited=git('ls-tree','-r','--name-only',BASE,'research','certificates').splitlines()
          require(len(inherited)==663,'inherited count')
          for p in inherited:
              require(Path(p).read_bytes()==subprocess.check_output(['git','show',BASE+':'+p]),'inherited evidence changed: '+p)
          plan=subprocess.check_output(['make','-n','check'],text=True).splitlines()
          require(len(plan)==len(set(plan))==74,'full plan changed')
          out=Path('certificates/compact_mixing_remote_replay');out.mkdir()
          commands=[(['make','check-compact-mixing'],0),(['make','check-radical-transfer'],0),(['python3','-S','research/check_integration.py'],0),(['python3','-O','-S','research/verify_compact_mixing_transfer.py'],1),(['python3','-O','-S','research/verify_qubit_rounding.py'],1)]
          records=[]
          for i,(c,expected) in enumerate(commands):
              started=time.time();r=subprocess.run(c,stdout=subprocess.PIPE,stderr=subprocess.STDOUT,timeout=180)
              p=out/f'{i}.log';p.write_bytes(r.stdout)
              require(r.returncode==expected,'unexpected check exit: '+str(c))
              if expected:require(b'non-optimized Python' in r.stdout,'wrong negative-check failure')
              records.append(dict(command=c,returncode=r.returncode,expected_returncode=expected,seconds=round(time.time()-started,3),log=str(p),sha256=sha(r.stdout)))
          require(not git('diff','--name-only'),'verification modified reviewed files')
          report=dict(schema='hn-compact-mixing-remote-v1',status='PASS_SCOPED_CHECKS',date='2026-10-07',source_commit=source,
              local_commit_preserved=LOCAL,reviewed_tree=TREE,base_commit=BASE,run_id=os.environ['GITHUB_RUN_ID'],commands=records,
              original_local_full_check_status='TIMEOUT_124_AFTER_300_SECONDS',full_make_check_passed=False,full_make_check_repeated_remotely=False,
              inherited_scientific_files_unchanged=len(inherited),original_local_proof_and_log_bytes_unchanged=True,
              fixed_source_manifest_sha256='e25c1fd2ed9f88ecf8a9e1bc5aa448829717ca0dbfed8908a5aca0c5b4f3cc65',
              new_claims_lean_formalized=False,plane_six_or_seven_decided=False,explicit_non5_found=False,full15_decided=False,
              scope='Exact reviewed local tree and original commit restored. New finite mechanisms and inherited radical calibration replayed independently, with current syntax/ID audit. Not a full 74-command PASS, not formalization of general written proofs, and no novelty priority assertion. Publication is recorded separately after the actual push.')
          rp=Path('certificates/compact_mixing_remote_validation.json');save(rp,report)
          r=subprocess.run(['python3','-S','research/check_integration.py'],stdout=subprocess.PIPE,stderr=subprocess.STDOUT,timeout=180)
          require(r.returncode==0,'final static failed');(out/'final-static.log').write_bytes(r.stdout)
          report['final_static']=json.loads(r.stdout);report['final_static_log_sha256']=sha(r.stdout)
          require(report['final_static']['source_manifest_sha256']==report['fixed_source_manifest_sha256'],'final source fingerprint')
          save(rp,report)
          subprocess.run(['git','diff','--check'],check=True)
          new={str(rp)}|{str(p) for p in out.glob('*.log')}
          require(set(git('ls-files','--others','--exclude-standard').splitlines())<=new,'unexpected untracked data')
          subprocess.run(['git','add','-f','--',*sorted(new)],check=True)
          tree=git('write-tree')
          msg=('research: publish compact target, sharp qubit rounding and mixing obstruction with independent replay\n\nPreserve original local commit and all raw local timeout logs. General proofs are written, not Lean-formalized. Odd-degree two-color theorem is credited as existing; explicit formula calibrates spectral escape. No new ordinary HN bound, full15 decision, or full regression PASS.\n').encode()
          head=git('commit-tree',tree,'-p',source,'-p',LOCAL,input=msg)
          git('reset','--hard',head)
          require(git('ls-remote','origin','refs/heads/'+BRANCH).split()[0]==source,'branch moved')
          auth=base64.b64encode(('x-access-token:'+os.environ['GH_TOKEN']).encode()).decode()
          env=os.environ.copy();env.update(GIT_CONFIG_COUNT='1',GIT_CONFIG_KEY_0='http.https://github.com/.extraheader',GIT_CONFIG_VALUE_0='AUTHORIZATION: basic '+auth)
          subprocess.run(['git','push','--porcelain','origin','HEAD:refs/heads/'+BRANCH],env=env,check=True)
          require(git('ls-remote','origin','refs/heads/'+BRANCH).split()[0]==head,'publication readback')
          final=tmp/'published';final.mkdir();git('branch','published-output',head)
          subprocess.run(['git','bundle','create',str(final/'continuation.bundle'),'published-output','^'+BASE],check=True)
          save(final/'publication.json',dict(status='PUBLISHED_AND_READ_BACK',commit=head,tree=tree,original_local_commit=LOCAL,base=BASE,report=report))
          print('PUBLISHED',head,tree,flush=True)
          PY
      - name: Preserve actual publication or failure evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: compact-mixing-published
          path: |
            ${{ runner.temp }}/published
            ${{ runner.temp }}/verification.log
            certificates/compact_mixing_remote_replay
          retention-days: 30
          if-no-files-found: error
