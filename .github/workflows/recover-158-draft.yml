name: Recover pending Family158 draft
on:
  push:
    branches: [research/openai-158-audit-20261007]
    paths: [.github/workflows/recover-158-draft.yml]
permissions:
  contents: read
jobs:
  recover:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Fetch exact unreachable blob objects as data only
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import base64,hashlib,json,lzma,os,subprocess
          from pathlib import Path
          out=Path(os.environ['RUNNER_TEMP'])/'recovered';out.mkdir()
          ids=['876bc55b3f3a5b8f1eb9a2145bb9abeb5e8c14fe','2cb7abf5d23e365aa0565498b28e308d7677fce1','3a15688cc48b57c1f2cfbd9dd5aa270ef6519c30','66f33f86ca5674e0be1d50e53efce27242b00113']
          parts=[]
          for sha in ids:
              r=json.loads(subprocess.check_output(['gh','api','repos/rsgcsg/math-research/git/blobs/'+sha]))
              b=base64.b64decode(r['content']);assert hashlib.sha1(b'blob '+str(len(b)).encode()+b'\0'+b).hexdigest()==sha
              (out/(sha+'.bin')).write_bytes(b);parts.append(b)
          packed=b''.join(parts);(out/'draft.xz').write_bytes(packed)
          raw=lzma.decompress(packed,memlimit=256*1024*1024);assert len(raw)<20_000_000
          (out/'draft.decoded').write_bytes(raw)
          (out/'receipt.json').write_text(json.dumps({'blob_ids':ids,'packed_sha256':hashlib.sha256(packed).hexdigest(),'decoded_bytes':len(raw),'scope':'Recovered draft data only. Not executed or certified.'},indent=2)+'\n')
          print('RECOVERED_DATA',len(raw),raw[:120])
          PY
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: family158-recovered-draft
          path: ${{ runner.temp }}/recovered
          if-no-files-found: error
          retention-days: 30
