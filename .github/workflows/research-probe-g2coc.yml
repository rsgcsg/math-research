name: Research generalized G2COC probe
on:
  pull_request:
    paths:
      - 'research/probe_g2coc_full_y.py'
      - 'research/verify_full_y_c5_g2coc.py'
      - '.github/workflows/research-probe-g2coc.yml'
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Independently replay full-Y known-coordinate c5 G2COC ceiling
        run: python3 -S research/verify_full_y_c5_g2coc.py --write-receipt --receipt "$RUNNER_TEMP/full-y-c5-g2coc.json"
      - name: Upload exact replay
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: full-y-c5-g2coc
          path: ${{ runner.temp }}/full-y-c5-g2coc.json
          retention-days: 3
          if-no-files-found: error
